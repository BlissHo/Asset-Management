<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 자산 관리 서비스</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        .highlight { color: #2c3e50; font-weight: bold; font-size: 1.2em; }
        #loading { color: #e67e22; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💰 자산 관리 대시보드</h1>
        <hr>
        <p>원화 자산: <span class="highlight">1,000,000원</span></p>
        <p id="exchange-rate">환율 불러오는 중... <span id="loading">(잠시만 기다려주세요)</span></p>
        <p>달러 환산: <span id="usd-result" class="highlight">-</span></p>
        <hr>
        <p style="font-size: 0.8em; color: gray;">* 1분마다 실시간 환율이 업데이트됩니다.</p>
    </div>

<script>
        async function getExchangeRate() {
            const rateDisplay = document.getElementById('exchange-rate');
            const usdDisplay = document.getElementById('usd-result');
            
            // 시도해볼 API 목록 (하나가 안되면 다음 것을 시도함)
            const apiUrls = [
                'https://open.er-api.com/v6/latest/USD',
                'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json'
            ];

            for (let url of apiUrls) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('연결 실패');
                    const data = await response.json();
                    
                    // API마다 데이터 구조가 다르므로 맞춰줌
                    let rate = data.rates ? data.rates.KRW : data.usd.krw;
                    
                    const krwAsset = 1000000;
                    const usdAsset = (krwAsset / rate).toFixed(2);

                    rateDisplay.innerHTML = `현재 환율: <b>1달러 = ${rate.toFixed(2)}원</b>`;
                    usdDisplay.innerText = `$${usdAsset}`;
                    return; // 성공하면 함수 종료
                } catch (e) {
                    console.log(url + " 실패, 다음 API 시도 중...");
                }
            }
            rateDisplay.innerText = "환율 API 점검 중입니다. 잠시 후 새로고침 해주세요.";
        }

        getExchangeRate();
        setInterval(getExchangeRate, 60000);
    </script>

</body>
</html>
