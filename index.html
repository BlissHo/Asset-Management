<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 v1.0.13</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; --yellow: #f1c40f; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { flex: 1; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 26px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .in { background: var(--green); } .out { background: var(--up); }
        .history-list { max-height: 350px; overflow-y: auto; }
        .profit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .profit-table th { text-align: left; color: var(--gray); padding-bottom: 10px; border-bottom: 1px solid #eee; font-size: 11px; }
        .profit-table td { padding: 12px 0; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }
        .auth-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; font-size: 14px; color: var(--primary); }
        .auth-links span { cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <input type="email" id="email" class="input-group" placeholder="이메일">
            <input type="password" id="pw1" class="input-group" placeholder="비밀번호">
            <div style="text-align: left; margin-bottom: 15px;">
                <input type="checkbox" id="remember-me"> <label for="remember-me" style="font-size:14px; color:var(--gray);">로그인 정보(ID/PW) 저장</label>
            </div>
            <button class="btn" onclick="handleAuth('login')">로그인</button>
            <div class="auth-links"><span onclick="handleAuth('signup')">계정 생성</span><span onclick="resetPassword()">비밀번호 찾기</span></div>
            <div style="margin-top: 25px; font-size: 11px; color: #ccc;">version 1.0.13.</div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            <div id="page-home" class="page active-page">
                <div class="card" style="text-align: center;">
                    <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="h-total-usd" style="font-size:20px; color:var(--gray);">$ 0.00</div>
                </div>
                <div class="card"><canvas id="assetChart"></canvas></div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3>입출금/매매</h3>
                    <div class="input-row"><select id="trade-type" style="flex:0.5;"><option value="buy">매수</option><option value="sell">매도</option></select><select id="trade-currency" style="flex:0.5;"><option value="KRW">KRW</option><option value="USD">USD</option></select></div>
                    <input type="text" id="stock-name" class="input-group" placeholder="종목명">
                    <div class="input-row"><input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량"><input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가"></div>
                    <button class="btn" onclick="saveTrade()">저장</button>
                    <div id="log-history-list" class="history-list" style="margin-top:20px;"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card">
                    <table class="profit-table">
                        <thead>
                            <tr>
                                <th>종목/수량</th>
                                <th>평단/종가</th>
                                <th style="text-align:right;">평가액/수익률</th>
                            </tr>
                        </thead>
                        <tbody id="stock-profit-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-more" class="page">
                <div class="card"><button class="btn" onclick="location.reload()">로그아웃</button></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익</span></button>
            <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const EX_RATE = 1350.5;

        // v1.0.12 핵심 로직 100% 동일 유지
        auth.onAuthStateChanged(user => {
            if (user) { document.getElementById('auth-section').style.display = 'none'; document.getElementById('main-section').style.display = 'block'; subscribeData(); }
            else { document.getElementById('auth-section').style.display = 'flex'; document.getElementById('main-section').style.display = 'none'; }
        });

        window.onload = () => {
            const e = localStorage.getItem('savedEmail'), p = localStorage.getItem('savedPw');
            if(e) { document.getElementById('email').value = e; document.getElementById('remember-me').checked = true; }
            if(p) document.getElementById('pw1').value = p;
        };

        function updateUI(trades) {
            let cashKRW = 0, cashUSD = 0, stocks = {};
            const sorted = [...trades].sort((a,b) => a.date.seconds - b.date.seconds);

            sorted.forEach(t => {
                if(t.type === 'fund') {
                    if(t.currency === 'KRW') cashKRW += (t.direction === 'in' ? 1 : -1) * t.amount;
                    else cashUSD += (t.direction === 'in' ? 1 : -1) * t.amount;
                } else {
                    const n = t.stockName.toUpperCase();
                    if(!stocks[n]) stocks[n] = { qty: 0, cost: 0, cur: t.currency, last: 0 };
                    stocks[n].last = t.price;
                    if(t.type === 'buy') { stocks[n].qty += t.quantity; stocks[n].cost += (t.quantity * t.price); }
                    else { stocks[n].qty -= t.quantity; stocks[n].cost -= (t.quantity * t.price); }
                }
            });

            let html = "";
            for(let n in stocks) {
                if(stocks[n].qty > 0) {
                    const s = stocks[n], avg = s.cost / s.qty, eval = s.qty * s.last, rate = ((s.last - avg) / avg) * 100;
                    const sym = s.cur === 'USD' ? '$' : '₩';
                    html += `<tr>
                        <td><b>${n}</b><br><small>${s.qty}주</small></td>
                        <td><div style="font-size:11px;color:var(--gray);">평단:${sym}${avg.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
                            <div style="font-weight:bold;">종가:${sym}${s.last.toLocaleString()}</div></td>
                        <td style="text-align:right;"><div style="font-weight:bold;color:var(--primary);">${sym}${eval.toLocaleString()}</div>
                            <div style="font-size:11px;color:${rate>=0?'var(--up)':'var(--down)'}; font-weight:bold;">${rate>=0?'▲':'▼'}${Math.abs(rate).toFixed(2)}%</div></td>
                    </tr>`;
                }
            }
            document.getElementById('stock-profit-table-body').innerHTML = html || "<tr><td colspan='3' style='text-align:center;'>내역 없음</td></tr>";
        }

        async function handleAuth(type) {
            const e = document.getElementById('email').value, p = document.getElementById('pw1').value;
            try {
                if(type === 'login') await auth.signInWithEmailAndPassword(e, p);
                else await auth.createUserWithEmailAndPassword(e, p);
                if(document.getElementById('remember-me').checked) { localStorage.setItem('savedEmail', e); localStorage.setItem('savedPw', p); }
                else { localStorage.removeItem('savedEmail'); localStorage.removeItem('savedPw'); }
            } catch(err) { alert(err.message); }
        }

        function subscribeData() { db.collection("trades").where("uid", "==", auth.currentUser.uid).orderBy("date", "desc").onSnapshot(snap => { let d = []; snap.forEach(doc => d.push(doc.data())); updateUI(d); }); }
        function changeTab(p, el) { document.querySelectorAll('.page').forEach(x => x.classList.remove('active-page')); document.getElementById('page-' + p).classList.add('active-page'); document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
        function formatNumber(el) { let v = el.value.replace(/[^0-9.]/g, ""); if(v) el.value = Number(v).toLocaleString(); }
        async function saveTrade() { await db.collection("trades").add({ uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, currency: document.getElementById('trade-currency').value, stockName: document.getElementById('stock-name').value, quantity: Number(document.getElementById('stock-qty').value.replace(/,/g,"")), price: Number(document.getElementById('stock-price').value.replace(/,/g,"")), date: new Date() }); }
    </script>
</body>
</html>
