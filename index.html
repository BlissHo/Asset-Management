<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* 입력 폼 공통 */
        .input-group { margin-bottom: 15px; }
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input, select { flex: 1; padding: 14px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-sub { background: #e4e6eb; color: var(--text); flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; }
        .btn-add { background: var(--green); color: white; }
        .btn-remove { background: var(--up); color: white; }

        /* 하단 내비게이션 */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 24px; }
        .nav-item span { font-size: 12px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }

        .page { display: none; }
        .active-page { display: block; }
        .badge { padding: 3px 8px; border-radius: 5px; font-size: 11px; color: white; font-weight: bold; }
        .history-list { max-height: 350px; overflow-y: auto; border-top: 1px solid #eee; }
        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px dotted #eee; font-size: 14px; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <div id="signup-fields" style="display: none;">
                <input type="text" id="nickname" placeholder="사용할 닉네임" style="width:100%; padding:14px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;">
            </div>
            <input type="email" id="email" placeholder="이메일" style="width:100%; padding:14px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;">
            <input type="password" id="pw1" placeholder="비밀번호" style="width:100%; padding:14px; margin-bottom:20px; border-radius:10px; border:1px solid #ddd;">
            <button class="btn" onclick="handleAuth()" id="main-btn">로그인</button>
            <div style="margin-top: 25px; font-size: 14px;">
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="toggleMode()" id="toggle-text">계정 생성</span>
                <span style="margin: 0 15px; color: #ccc;">|</span>
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="resetPassword()">비밀번호 찾기</span>
            </div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <header style="margin-bottom: 20px; display: flex; justify-content: space-between;">
                    <span id="welcome-msg" style="font-weight: bold; font-size: 18px;">회원님</span>
                    <span style="font-size: 12px; color: var(--gray); cursor: pointer;" onclick="location.reload()">로그아웃</span>
                </header>
                <div class="card" style="text-align: center; background: linear-gradient(135deg, #1877f2, #0056b3); color: white;">
                    <div style="font-size: 13px; opacity: 0.9;">총 자산 평가액</div>
                    <div id="h-total-krw" style="font-size: 28px; font-weight: 800; margin: 10px 0;">₩ 0</div>
                    <div id="h-total-usd" style="font-size: 16px; opacity: 0.9;">$ 0.00</div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📊 자산 구성 비중</h3>
                    <div style="height: 250px;"><canvas id="assetChart"></canvas></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card" style="border: 2px solid #e1f5fe;">
                    <h3 style="margin-top:0; color: #0288d1;">💰 투자금 관리 (입/출금)</h3>
                    <div class="input-row">
                        <select id="fund-currency" style="flex:0.4;"><option value="KRW">원화(₩)</option><option value="USD">달러($)</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액 입력" style="flex:1;">
                    </div>
                    <div class="input-row">
                        <button class="btn-sub btn-add" onclick="saveFund('in')">자산 추가 (+)</button>
                        <button class="btn-sub btn-remove" onclick="saveFund('out')">자산 빼기 (-)</button>
                    </div>
                </div>

                <div class="card">
                    <h3 style="margin-top:0;">📝 종목 매매 기록</h3>
                    <div class="input-group">
                        <select id="trade-type"><option value="buy">매수 (BUY)</option><option value="sell">매도 (SELL)</option></select>
                    </div>
                    <input type="text" id="stock-name" placeholder="종목명 (예: NVDA)" class="input-group" style="width:100%;">
                    <div class="input-row">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">매매 기록 저장</button>
                </div>

                <div class="card">
                    <h3 style="margin-top:0;">📅 최근 1개월 활동</h3>
                    <div id="log-history-list" class="history-list">
                        <p style="text-align:center; color:var(--gray); padding:20px;">기록이 없습니다.</p>
                    </div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="display: flex; justify-content: space-between; text-align: center; background: #fff; border: 1px solid #eee;">
                    <div><div style="font-size:11px; color:var(--gray);">투자 원금</div><div id="p-total-inv" style="font-weight:bold; color:var(--text);">₩ 0</div></div>
                    <div><div style="font-size:11px; color:var(--gray);">수익금</div><div id="p-total-profit" style="font-weight:bold; color:var(--up);">₩ 0</div></div>
                    <div><div style="font-size:11px; color:var(--gray);">수익률</div><div id="p-total-rate" style="font-weight:bold; color:var(--up);">0%</div></div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📈 종목별 수익 상세</h3>
                    <div id="stock-profit-list"></div>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="alert('더보기 준비 중')"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg",
            authDomain: "assetmanager-66aec.firebaseapp.com",
            projectId: "assetmanager-66aec",
            storageBucket: "assetmanager-66aec.firebasestorage.app",
            messagingSenderId: "928785817084",
            appId: "1:928785817084:web:2b75ce39d745bdc3202679"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let myChart = null;

        function formatNumber(el) {
            let val = el.value.replace(/[^0-9]/g, "");
            if(val) el.value = Number(val).toLocaleString();
        }

        async function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            
            if(pageId === 'home') loadHomeData();
            if(pageId === 'log') loadAllHistory();
            if(pageId === 'profit') loadProfitStats();
        }

        // [투자금 저장]
        async function saveFund(direction) {
            const user = auth.currentUser;
            const currency = document.getElementById('fund-currency').value;
            const amount = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            if(!amount) return alert("금액을 입력하세요.");

            await db.collection("trades").add({
                uid: user.uid, type: 'fund', direction: direction, currency: currency,
                amount: amount, date: new Date(), stockName: "자산이동"
            });
            alert("자산 정보가 반영되었습니다.");
            document.getElementById('fund-amount').value = "";
            loadAllHistory();
        }

        // [매매 저장]
        async function saveTrade() {
            const user = auth.currentUser;
            const type = document.getElementById('trade-type').value;
            const name = document.getElementById('stock-name').value;
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));

            if(!name || !qty || !price) return alert("매매 정보를 입력하세요.");

            await db.collection("trades").add({
                uid: user.uid, type: type, stockName: name.toUpperCase(),
                quantity: qty, price: price, date: new Date()
            });
            alert("매매 기록이 저장되었습니다.");
            document.getElementById('stock-name').value = "";
            document.getElementById('stock-qty').value = "";
            document.getElementById('stock-price').value = "";
            loadAllHistory();
        }

        // [매매일지 하단 리스트 로드]
        async function loadAllHistory() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc").limit(20).get();
            let html = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                const isFund = d.type === 'fund';
                const label = isFund ? (d.direction === 'in' ? '입금' : '출금') : (d.type === 'buy' ? '매수' : '매도');
                const color = (label === '입금' || label === '매수') ? 'buy' : 'sell';
                const mainText = isFund ? `${d.currency} ${d.amount.toLocaleString()}` : `${d.stockName} ${d.quantity}주`;
                
                html += `
                <div class="history-item">
                    <div><span class="badge ${color}">${label}</span> <b>${mainText}</b></div>
                    <div style="color:var(--gray); font-size:12px;">${d.date.toDate().toLocaleDateString()}</div>
                </div>`;
            });
            document.getElementById('log-history-list').innerHTML = html || "내역이 없습니다.";
        }

        // [수익현황 로직]
        async function loadProfitStats() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).get();
            let stocks = {};
            let totalInv = 0;

            snapshot.forEach(doc => {
                const d = doc.data();
                if(d.type === 'fund') return;
                if(!stocks[d.stockName]) stocks[d.stockName] = { cost: 0, qty: 0 };
                const amt = d.quantity * d.price;
                if(d.type === 'buy') { stocks[d.stockName].cost += amt; stocks[d.stockName].qty += d.quantity; totalInv += amt; }
                else { stocks[d.stockName].cost -= amt; stocks[d.stockName].qty -= d.quantity; totalInv -= amt; }
            });

            document.getElementById('p-total-inv').innerText = `₩ ${totalInv.toLocaleString()}`;
            // 가상 수익률 (실제 API 연동 전 12.4% 가정)
            document.getElementById('p-total-profit').innerText = `₩ ${Math.floor(totalInv * 0.124).toLocaleString()}`;
            document.getElementById('p-total-rate').innerText = `12.4%`;

            let html = "";
            for(let name in stocks) {
                const s = stocks[name];
                if(s.qty <= 0) continue;
                html += `
                <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #eee;">
                    <div><b>${name}</b><br><small>${s.qty}주 보유</small></div>
                    <div style="text-align:right;">원금: ₩${s.cost.toLocaleString()}<br><span style="color:var(--up); font-size:12px;">수익: +12.4%</span></div>
                </div>`;
            }
            document.getElementById('stock-profit-list').innerHTML = html || "데이터가 없습니다.";
        }

        // [홈 차트 및 자산]
        async function loadHomeData() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).get();
            let total = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                if(d.type === 'fund') total += (d.direction === 'in' ? 1 : -1) * d.amount;
                else total += (d.type === 'buy' ? 1 : -1) * (d.quantity * d.price);
            });
            document.getElementById('h-total-krw').innerText = `₩ ${total.toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(total/1350).toFixed(2)}`;
            setTimeout(initChart, 200);
        }

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['미주', '한주', '달러', '현금'],
                    datasets: [{ data: [55, 25, 15, 5], backgroundColor: ['#1877f2', '#8bc34a', '#4da1ff', '#cddc39'], borderWidth:0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        // [인증]
        let isSignUpMode = false;
        function toggleMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('signup-fields').style.display = isSignUpMode ? "block" : "none";
            document.getElementById('main-btn').innerText = isSignUpMode ? "회원가입" : "로그인";
            document.getElementById('toggle-text').innerText = isSignUpMode ? "로그인하기" : "계정 생성";
        }
        async function resetPassword() {
            const email = prompt("이메일을 입력하세요:");
            if(email) auth.sendPasswordResetEmail(email).then(() => alert("메일 발송 완료"));
        }
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('pw1').value;
            try {
                if(isSignUpMode) {
                    const res = await auth.createUserWithEmailAndPassword(email, pw);
                    await db.collection("users").doc(res.user.uid).set({ nickname: document.getElementById('nickname').value });
                    alert("가입 성공!"); location.reload();
                } else {
                    const res = await auth.signInWithEmailAndPassword(email, pw);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    loadHomeData();
                }
            } catch(e) { alert(e.message); }
        }
    </script>
</body>
</html>
