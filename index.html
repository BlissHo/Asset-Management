<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo Asset Manager v1.0.1</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select { width: 100%; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 24px; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; color: white; margin-right: 5px; }
        .in, .buy { background: var(--up); } .out, .sell { background: var(--down); }
        .history-list { max-height: 300px; overflow-y: auto; }
        #chart-wrapper { position: relative; height: 250px; width: 100%; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary);">BlissHo Asset</h1>
            <div id="signup-fields" style="display: none;"><input type="text" id="nickname" placeholder="닉네임"></div>
            <input type="email" id="email" placeholder="이메일">
            <input type="password" id="pw1" placeholder="비밀번호">
            <div style="text-align: left; margin-bottom: 15px;"><input type="checkbox" id="remember-me"> 아이디 저장</div>
            <button class="btn" onclick="handleAuth()" id="main-btn">로그인</button>
            <p style="margin-top: 20px; font-size: 14px; color: var(--gray); text-decoration: underline; cursor: pointer;" onclick="toggleMode()">계정 생성 / 로그인 전환</p>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <div class="card" style="text-align: center; background: linear-gradient(135deg, #1877f2, #0056b3); color: white;">
                    <div style="font-size: 14px; opacity: 0.9;">내 총 자산 평가액</div>
                    <div id="h-total-krw" style="font-size: 30px; font-weight: 800; margin: 10px 0;">₩ 0</div>
                    <div id="h-total-usd" style="font-size: 18px; opacity: 0.8;">$ 0.00</div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📊 자산 구성 비중</h3>
                    <div id="chart-wrapper"><canvas id="assetChart"></canvas></div>
                </div>
                <div class="card">
                    <h3>🕒 최근 매매</h3>
                    <div id="home-recent-list"></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3>💰 입출금</h3>
                    <div style="display: flex; gap: 5px;">
                        <select id="fund-currency" style="flex:1;"><option value="KRW">₩ 원화</option><option value="USD">$ 달러</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액" style="flex:2;">
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button onclick="saveFund('in')" class="btn" style="background:var(--green);">입금</button>
                        <button onclick="saveFund('out')" class="btn" style="background:var(--up);">출금</button>
                    </div>
                </div>
                <div class="card">
                    <h3>📝 매수/매도</h3>
                    <select id="trade-type"><option value="buy">매수</option><option value="sell">매도</option></select>
                    <input type="text" id="stock-name" placeholder="종목명">
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">기록 저장</button>
                </div>
                <div class="card">
                    <h3>📅 활동 내역 (최근 1개월)</h3>
                    <div id="log-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="background: #f8f9fa;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center;">
                        <div><small>총 매수금액</small><div id="p-total-buy" style="font-weight:bold;">₩ 0</div></div>
                        <div><small>잔여 현금</small><div id="p-total-cash" style="font-weight:bold;">₩ 0</div></div>
                        <div style="grid-column: span 2; border-top: 1px solid #eee; pt: 10px;">
                            <small>현금 비중</small><div id="p-cash-rate" style="font-size: 20px; font-weight: bold; color: var(--green);">0%</div>
                        </div>
                    </div>
                </div>
                <div id="stock-detail-list"></div>
            </div>

            <div id="page-more" class="page">
                <div class="card">
                    <h3>⚙️ 데이터 관리</h3>
                    <button class="btn" style="background: var(--up);" onclick="clearAllData()">데이터 전체 초기화</button>
                    <button class="btn" style="background: var(--gray); margin-top: 10px;" onclick="location.reload()">로그아웃</button>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const RATE = 1350.5;

        window.onload = () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if(savedEmail) document.getElementById('email').value = savedEmail;
        };

        function formatNumber(el) { let val = el.value.replace(/[^0-9]/g, ""); if(val) el.value = Number(val).toLocaleString(); }

        function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            if(pageId === 'home') syncData();
        }

        // [데이터 실시간 동기화 마스터 함수] (중요)
        function syncData() {
            const user = auth.currentUser;
            if(!user) return;
            // onSnapshot을 사용하여 데이터가 변하면 즉시 모든 화면을 갱신합니다.
            db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc").onSnapshot(snap => {
                let trades = [];
                snap.forEach(doc => trades.push(doc.data()));
                updateUI(trades);
            });
        }

        function updateUI(trades) {
            let cash = 0; let stockValue = 0; let buySum = 0;
            let stocks = {}; let logHtml = ""; let homeRecentHtml = "";

            trades.forEach((t, i) => {
                const val = (t.type === 'fund') ? (t.currency === 'USD' ? t.amount * RATE : t.amount) : (t.quantity * t.price);
                if(t.type === 'fund') cash += (t.direction === 'in' ? 1 : -1) * val;
                else {
                    if(t.type === 'buy') { buySum += val; cash -= val; stockValue += val; }
                    else { buySum -= val; cash += val; stockValue -= val; }
                    
                    if(!stocks[t.stockName]) stocks[t.stockName] = { qty: 0, cost: 0 };
                    stocks[t.stockName].qty += (t.type === 'buy' ? 1 : -1) * t.quantity;
                    stocks[t.stockName].cost += (t.type === 'buy' ? 1 : -1) * val;

                    if(i < 5) homeRecentHtml += `<div style="font-size:13px; padding:8px 0; border-bottom:1px solid #f0f0f0;"><b>${t.stockName}</b> ${t.quantity}주 ${t.type==='buy'?'매수':'매도'}</div>`;
                }

                logHtml += `<div style="padding:12px 0; border-bottom:1px solid #f9f9f9; font-size:14px;">
                    <span class="badge ${t.type === 'fund' ? t.direction : t.type}">${t.type === 'fund' ? (t.direction==='in'?'입금':'출금') : (t.type==='buy'?'매수':'매도')}</span>
                    <b>${t.type === 'fund' ? t.currency + " " + t.amount.toLocaleString() : t.stockName + " " + t.quantity + "주"}</b>
                </div>`;
            });

            // UI 반영
            const totalEval = cash + stockValue;
            document.getElementById('h-total-krw').innerText = `₩ ${totalEval.toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(totalEval / RATE).toFixed(2)}`;
            document.getElementById('p-total-buy').innerText = `₩ ${buySum.toLocaleString()}`;
            document.getElementById('p-total-cash').innerText = `₩ ${cash.toLocaleString()}`;
            document.getElementById('p-cash-rate').innerText = totalEval > 0 ? `${((cash/totalEval)*100).toFixed(1)}%` : "0%";
            document.getElementById('log-history-list').innerHTML = logHtml || "내역 없음";
            document.getElementById('home-recent-list').innerHTML = homeRecentHtml || "매매 내역 없음";

            // 종목 리스트
            let stockHtml = "";
            for(let name in stocks) {
                if(stocks[name].qty <= 0) continue;
                stockHtml += `<div class="card"><b>${name}</b> | ${stocks[name].qty}주<br><small>평단: ₩${Math.floor(stocks[name].cost/stocks[name].qty).toLocaleString()}</small></div>`;
            }
            document.getElementById('stock-detail-list').innerHTML = stockHtml;

            updateChart(stockValue, cash);
        }

        function updateChart(stock, cash) {
            const ctx = document.getElementById('assetChart');
            if(!ctx) return;
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['주식', '현금'], datasets: [{ data: [stock, cash], backgroundColor: ['#1877f2', '#00a400'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { tooltip: { enabled: true } } }
            });
        }

        async function saveFund(dir) {
            const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            if(!amt) return;
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: 'fund', direction: dir, currency: document.getElementById('fund-currency').value, amount: amt, date: new Date() });
            document.getElementById('fund-amount').value = "";
        }

        async function saveTrade() {
            const name = document.getElementById('stock-name').value.toUpperCase();
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
            if(!name || !qty || !price) return;
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, stockName: name, quantity: qty, price: price, date: new Date() });
            document.getElementById('stock-name').value = ""; document.getElementById('stock-qty').value = ""; document.getElementById('stock-price').value = "";
        }

        async function clearAllData() {
            if(!confirm("모든 데이터를 삭제할까요?")) return;
            const snap = await db.collection("trades").where("uid", "==", auth.currentUser.uid).get();
            const batch = db.batch();
            snap.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert("초기화 완료");
        }

        let isSignUpMode = false;
        function toggleMode() { isSignUpMode = !isSignUpMode; document.getElementById('signup-fields').style.display = isSignUpMode ? "block" : "none"; }
        async function handleAuth() {
            const email = document.getElementById('email').value; const pw = document.getElementById('pw1').value;
            try {
                if(isSignUpMode) await auth.createUserWithEmailAndPassword(email, pw);
                else {
                    await auth.signInWithEmailAndPassword(email, pw);
                    if(document.getElementById('remember-me').checked) localStorage.setItem('savedEmail', email);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    syncData();
                }
            } catch(e) { alert(e.message); }
        }
    </script>
</body>
</html>
