<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 자산 관리 서비스</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin-top: 0; }
        .info-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 1.1rem; }
        .highlight { font-weight: bold; color: #007bff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        th { background-color: #f1f3f5; font-size: 0.9rem; }
        .plus { color: #d63031; } /* 상승 */
        .minus { color: #0984e3; } /* 하락 */
        
        .input-group { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; flex: 1; min-width: 100px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>💰 전체 자산 요약</h1>
            <div class="info-row">
                <span>실시간 원/달러 환율:</span>
                <span id="rate-text" class="highlight">불러오는 중...</span>
            </div>
        </div>

        <div class="card">
            <h1>📊 주식 자산 관리</h1>
            <div class="input-group">
                <input type="text" id="stock-name" placeholder="종목명(예: NVDA)">
                <input type="number" id="buy-price" placeholder="매수평균가($)">
                <input type="number" id="stock-qty" placeholder="보유수량">
                <button onclick="addStock()">추가하기</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>종목(시장)</th>
                        <th>현재가($)</th>
                        <th>매수평가($)</th>
                        <th>수익률</th>
                        <th>평가손익($)</th>
                    </tr>
                </thead>
                <tbody id="stock-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentRate = 1350; // 기본값

        // 1. 환율 가져오기
        async function updateExchangeRate() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                currentRate = data.rates.KRW;
                document.getElementById('rate-text').innerText = `1달러 = ${currentRate.toFixed(2)}원`;
            } catch (e) {
                console.error("환율 업데이트 실패");
            }
        }

        // 2. 주식 추가 기능
        async function addStock() {
            const name = document.getElementById('stock-name').value.toUpperCase();
            const buyPrice = parseFloat(document.getElementById('buy-price').value);
            const qty = parseFloat(document.getElementById('stock-qty').value);

            if (!name || !buyPrice || !qty) {
                alert("모든 정보를 입력해주세요.");
                return;
            }

            // 실시간 주가는 나중에 복잡한 API가 필요하므로, 일단 임의의 현재가(매수기반)로 시작합니다.
            // (다음 단계에서 실제 주가를 연동해볼게요!)
            const currentPrice = buyPrice * (1 + (Math.random() * 0.1 - 0.05)); // 테스트용 변동
            const profitRate = ((currentPrice - buyPrice) / buyPrice * 100).toFixed(2);
            const profitAmount = ((currentPrice - buyPrice) * qty).toFixed(2);

            const row = `
                <tr>
                    <td><b>${name}</b><br><small>미국(NASDAQ)</small></td>
                    <td>$${currentPrice.toFixed(2)}</td>
                    <td>$${buyPrice.toFixed(2)}</td>
                    <td class="${profitRate >= 0 ? 'plus' : 'minus'}">${profitRate}%</td>
                    <td class="${profitAmount >= 0 ? 'plus' : 'minus'}">$${profitAmount}</td>
                </tr>
            `;

            document.getElementById('stock-table-body').innerHTML += row;
            
            // 입력창 비우기
            document.getElementById('stock-name').value = '';
            document.getElementById('buy-price').value = '';
            document.getElementById('stock-qty').value = '';
        }

        updateExchangeRate();
    </script>
</body>
</html>
