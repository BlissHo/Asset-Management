<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 v1.0.12</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; --yellow: #f1c40f; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { flex: 1; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 26px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .in { background: var(--green); } .out { background: var(--up); }
        .history-list { max-height: 350px; overflow-y: auto; }
        .profit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .profit-table th { text-align: left; color: var(--gray); padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .profit-table td { padding: 12px 0; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }
        .auth-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; font-size: 14px; color: var(--primary); }
        .auth-links span { cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <input type="email" id="email" class="input-group" placeholder="이메일">
            <input type="password" id="pw1" class="input-group" placeholder="비밀번호">
            <div style="text-align: left; margin-bottom: 15px;">
                <input type="checkbox" id="remember-me"> <label for="remember-me" style="font-size:14px; color:var(--gray);">로그인 정보(ID/PW) 저장</label>
            </div>
            <button class="btn" onclick="handleAuth('login')">로그인</button>
            <div class="auth-links"><span onclick="handleAuth('signup')">계정 생성</span><span onclick="resetPassword()">비밀번호 찾기</span></div>
            <div style="margin-top: 25px; font-size: 11px; color: #ccc;">version 1.0.12.</div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            <div id="page-home" class="page active-page">
                <div class="card" style="text-align: center;">
                    <div style="font-size: 15px; color: var(--gray);">내 총 자산 평가액</div>
                    <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="h-total-usd" style="font-size:20px; color:var(--gray); margin-bottom:10px;">$ 0.00</div>
                    <div style="font-size:12px; color:var(--up);">환율: $1 = 1,350.5원</div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📊 자산 구성 비중</h3>
                    <div style="height: 280px;"><canvas id="assetChart"></canvas></div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">🕒 최근 매매 내역</h3>
                    <div id="home-recent-list"></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3>💰 입출금</h3>
                    <div class="input-row">
                        <select id="fund-currency" style="flex:0.4;"><option value="KRW">원화</option><option value="USD">달러</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액">
                    </div>
                    <div class="input-row">
                        <button onclick="saveFund('in')" class="btn" style="background:var(--green); flex:1;">입금 (+)</button>
                        <button onclick="saveFund('out')" class="btn" style="background:var(--up); flex:1;">출금 (-)</button>
                    </div>
                </div>
                <div class="card">
                    <h3>📝 매수/매도</h3>
                    <div class="input-row">
                        <select id="trade-type" style="flex:0.5;"><option value="buy">매수</option><option value="sell">매도</option></select>
                        <select id="trade-currency" style="flex:0.5;"><option value="KRW">₩ (원화)</option><option value="USD">$ (미국)</option></select>
                    </div>
                    <input type="text" id="stock-name" class="input-group" 
                           placeholder="종목명 (미국주식: Ticker / 한국주식: 한글)" 
                           oninput="detectCurrency(this)">
                    <div class="input-row">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">저장하기</button>
                </div>
                <div class="card">
                    <h3>📅 활동 내역</h3>
                    <div id="log-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="background: var(--primary); color: white; text-align: center;">
                    <small style="opacity:0.8;">총 평가금액 (환산 합계)</small>
                    <div id="p-total-eval" style="font-size: 26px; font-weight: bold;">₩ 0</div>
                    <div id="p-total-eval-usd" style="font-size: 14px; opacity:0.9; margin-bottom:15px;">$ 0.00</div>
                    
                    <div style="display:flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.2); padding-top:15px; gap: 5px;">
                        <div style="flex:1;">
                            <small style="opacity:0.8;">매수원금 (보유기준)</small>
                            <div id="p-detail-buy-krw" style="font-size:13px; font-weight:bold;">₩ 0</div>
                            <div id="p-detail-buy-usd" style="font-size:13px; font-weight:bold;">$ 0.00</div>
                        </div>
                        <div style="width:1px; background:rgba(255,255,255,0.2);"></div>
                        <div style="flex:1;">
                            <small style="opacity:0.8;">잔여현금 (보유기준)</small>
                            <div id="p-detail-cash-krw" style="font-size:13px; font-weight:bold;">₩ 0</div>
                            <div id="p-detail-cash-usd" style="font-size:13px; font-weight:bold;">$ 0.00</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <table class="profit-table">
                        <thead><tr><th>종목</th><th>평단</th><th style="text-align:right;">평가액</th></tr></thead>
                        <tbody id="stock-profit-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-more" class="page">
                <div class="card"><h3>⚙️ 관리</h3><button class="btn" style="background:var(--up); margin-bottom:10px;" onclick="clearAllData()">전체 데이터 초기화</button><button class="btn" style="background:var(--gray);" onclick="location.reload()">로그아웃</button></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익</span></button>
            <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const EX_RATE = 1350.5;

        // 종목명 별칭 매핑 (동일 종목 인식용)
        const stockAlias = {
            "엔비디아": "NVDA", "로켓랩": "RKLL", "레드와이어": "RDW", "애플": "AAPL", "테슬라": "TSLA", "삼성": "삼성전자"
        };
        // 한글로 입력해도 미국 주식으로 인식할 예외 리스트
        const usStockKorean = ["엔비디아", "로켓랩", "레드와이어", "테슬라", "애플", "구글", "마이크로소프트"];

        function getStandardName(name) {
            const upperName = name.trim().toUpperCase();
            return stockAlias[upperName] || upperName;
        }

        // ★ v1.0.12 핵심: 통화 자동 감지 로직
        function detectCurrency(el) {
            const val = el.value.trim();
            const curSelect = document.getElementById('trade-currency');
            if(!val) return;

            const isKorean = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(val);
            const isUsException = usStockKorean.includes(val);

            if (isUsException) {
                curSelect.value = "USD";
            } else if (isKorean) {
                curSelect.value = "KRW";
            } else if (/[a-zA-Z]/.test(val)) {
                curSelect.value = "USD";
            }
        }

        function updateUI(trades) {
            let cashKRW = 0; let cashUSD = 0; let stockBuyKRW = 0; let stockBuyUSD = 0;
            let stocks = {}; let logHtml = ""; let homeRecentHtml = "";

            trades.forEach((t) => {
                const isFund = t.type === 'fund';
                const cur = t.currency || 'KRW';
                if(isFund) {
                    if(cur === 'KRW') cashKRW += (t.direction === 'in' ? 1 : -1) * t.amount;
                    else cashUSD += (t.direction === 'in' ? 1 : -1) * t.amount;
                } else {
                    const name = getStandardName(t.stockName);
                    if(!stocks[name]) stocks[name] = { qty: 0, costKRW: 0, costUSD: 0, cur: cur };
                    const tradeAmt = t.quantity * t.price;
                    if(t.type === 'buy') {
                        stocks[name].qty += t.quantity;
                        if(cur === 'KRW') { stocks[name].costKRW += tradeAmt; stockBuyKRW += tradeAmt; cashKRW -= tradeAmt; }
                        else { stocks[name].costUSD += tradeAmt; stockBuyUSD += tradeAmt; cashUSD -= tradeAmt; }
                    } else {
                        const ratio = t.quantity / (stocks[name].qty + t.quantity);
                        stocks[name].qty -= t.quantity;
                        if(cur === 'KRW') { stockBuyKRW -= (stocks[name].costKRW * ratio); cashKRW += tradeAmt; }
                        else { stockBuyUSD -= (stocks[name].costUSD * ratio); cashUSD += tradeAmt; }
                    }
                    if(homeRecentHtml.split('border-bottom').length <= 5) {
                        const curSym = cur === 'USD' ? '$' : '₩';
                        homeRecentHtml += `<div style="padding:12px 0; border-bottom:1px solid #f0f0f0; font-size:13px; display:flex; justify-content:space-between;">
                            <span><b>${name}</b> ${t.quantity}주 ${t.type==='buy'?'매수':'매도'}</span>
                            <span style="color:var(--primary); font-weight:bold;">${curSym}${t.price.toLocaleString()}</span>
                        </div>`;
                    }
                }
                const label = isFund ? (t.direction==='in'?'입금':'출금') : (t.type==='buy'?'매수':'매도');
                logHtml += `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0f0f0;">
                    <div><span class="badge ${t.type==='buy'||t.direction==='in'?'in':'out'}">${label}</span> <b>${isFund?cur+' '+t.amount.toLocaleString():t.stockName+' '+t.quantity+'주'}</b></div>
                    <div style="font-size:12px; color:var(--gray);">${t.date ? t.date.toDate().toLocaleDateString() : '-'}</div>
                </div>`;
            });

            const totalStockKRW = Object.values(stocks).reduce((acc, s) => acc + s.costKRW + (s.costUSD * EX_RATE), 0);
            const totalEvalKRW = cashKRW + (cashUSD * EX_RATE) + totalStockKRW;

            document.getElementById('h-total-krw').innerText = `₩ ${Math.floor(totalEvalKRW).toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(totalEvalKRW / EX_RATE).toFixed(2)}`;
            document.getElementById('p-total-eval').innerText = `₩ ${Math.floor(totalEvalKRW).toLocaleString()}`;
            document.getElementById('p-total-eval-usd').innerText = `$ ${(totalEvalKRW / EX_RATE).toFixed(2)}`;
            document.getElementById('p-detail-buy-krw').innerText = `₩ ${Math.floor(stockBuyKRW).toLocaleString()}`;
            document.getElementById('p-detail-buy-usd').innerText = `$ ${stockBuyUSD.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('p-detail-cash-krw').innerText = `₩ ${Math.floor(cashKRW).toLocaleString()}`;
            document.getElementById('p-detail-cash-usd').innerText = `$ ${cashUSD.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            let stockHtml = "";
            for(let n in stocks) { 
                if(stocks[n].qty > 0) { 
                    const isUSD = stocks[n].cur === 'USD';
                    const avgPriceKRW = (stocks[n].costKRW + (stocks[n].costUSD * EX_RATE)) / stocks[n].qty;
                    const avgPriceUSD = avgPriceKRW / EX_RATE;
                    const evalKRW = stocks[n].costKRW + (stocks[n].costUSD * EX_RATE);
                    const evalUSD = evalKRW / EX_RATE;
                    stockHtml += `<tr><td><b>${n}</b><br><small>${stocks[n].qty}주 (${stocks[n].cur})</small></td><td>${isUSD ? `<div style="font-weight:bold;">$${avgPriceUSD.toFixed(2)}</div><div style="font-size:11px; color:var(--gray);">₩${Math.floor(avgPriceKRW).toLocaleString()}</div>` : `<div style="font-weight:bold;">₩${Math.floor(avgPriceKRW).toLocaleString()}</div><div style="font-size:11px; color:var(--gray);">$${avgPriceUSD.toFixed(2)}</div>`}</td><td style="text-align:right;">${isUSD ? `<div style="font-weight:bold; color:var(--primary);">$${evalUSD.toLocaleString(undefined,{maximumFractionDigits:2})}</div><div style="font-size:11px; color:var(--gray);">₩${Math.floor(evalKRW).toLocaleString()}</div>` : `<div style="font-weight:bold; color:var(--primary);">₩${Math.floor(evalKRW).toLocaleString()}</div><div style="font-size:11px; color:var(--gray);">$${evalUSD.toFixed(2)}</div>`}</td></tr>`; 
                } 
            }
            document.getElementById('stock-profit-table-body').innerHTML = stockHtml || "<tr><td colspan='3' style='text-align:center;'>내역 없음</td></tr>";
            document.getElementById('log-history-list').innerHTML = logHtml || "내역 없음";
            document.getElementById('home-recent-list').innerHTML = homeRecentHtml || "내역 없음";
            updateChart(stockBuyKRW, cashKRW, stockBuyUSD * EX_RATE, cashUSD * EX_RATE);
        }

        function updateChart(sK, cK, sU, cU) {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['한국주식', '원화현금', '미국주식', '달러현금'], datasets: [{ data: [sK, cK, sU, cU], backgroundColor: ['#f1c40f', '#1266df', '#d93025', '#00a400'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } });
        }

        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('pw1').value;
            const isRemember = document.getElementById('remember-me').checked;
            if(!email || !pw) return alert("입력하세요.");
            try {
                if(type === 'login') await auth.signInWithEmailAndPassword(email, pw);
                else await auth.createUserWithEmailAndPassword(email, pw);
                if(isRemember) { localStorage.setItem('savedEmail', email); localStorage.setItem('savedPw', pw); }
                else { localStorage.removeItem('savedEmail'); localStorage.removeItem('savedPw'); }
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('main-section').style.display = 'block';
                subscribeData();
            } catch(e) { alert(e.message); }
        }

        window.onload = () => {
            const savedEmail = localStorage.getItem('savedEmail');
            const savedPw = localStorage.getItem('savedPw');
            if(savedEmail) { document.getElementById('email').value = savedEmail; document.getElementById('remember-me').checked = true; }
            if(savedPw) document.getElementById('pw1').value = savedPw;
        };

        function subscribeData() { db.collection("trades").where("uid", "==", auth.currentUser.uid).orderBy("date", "desc").onSnapshot(snap => { let trades = []; snap.forEach(doc => trades.push({id: doc.id, ...doc.data()})); updateUI(trades); }); }
        async function saveTrade() {
            const name = document.getElementById('stock-name').value.trim();
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
            const cur = document.getElementById('trade-currency').value;
            if(!name || !qty || !price) return alert("항목을 채워주세요.");
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, currency: cur, stockName: name, quantity: qty, price: price, date: new Date() });
            document.getElementById('stock-name').value = ""; document.getElementById('stock-qty').value = ""; document.getElementById('stock-price').value = "";
        }
        async function saveFund(dir) {
            const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            const cur = document.getElementById('fund-currency').value;
            if(!amt) return;
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: 'fund', direction: dir, currency: cur, amount: amt, date: new Date() });
            document.getElementById('fund-amount').value = "";
        }
        async function clearAllData() { if(!confirm("초기화하시겠습니까?")) return; const snap = await db.collection("trades").where("uid", "==", auth.currentUser.uid).get(); const batch = db.batch(); snap.forEach(doc => batch.delete(doc.ref)); await batch.commit(); }
        function changeTab(pageId, el) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById('page-' + pageId).classList.add('active-page'); document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active')); el.classList.add('active'); }
        function formatNumber(el) { let val = el.value.replace(/[^0-9.]/g, ""); if(val) el.value = Number(val).toLocaleString(); }
        async function resetPassword() { const email = document.getElementById('email').value; if(!email) return alert("이메일 입력 필요"); await auth.sendPasswordResetEmail(email); alert("발송완료"); }
    </script>
</body>
</html>
