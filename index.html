<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* 홈 화면 */
        .total-amount { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
        .usd-amount { font-size: 20px; color: var(--gray); margin-bottom: 12px; font-weight: 600; }
        .exchange-rate { font-size: 14px; color: var(--up); background: #fce8e6; padding: 8px 15px; border-radius: 50px; display: inline-block; font-weight: bold; }

        /* 매매일지 모바일 최적화 */
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 15px; margin-bottom: 8px; color: var(--gray); font-weight: 600; }
        input, select { width: 100%; padding: 16px; border: 1.5px solid #eee; border-radius: 14px; font-size: 16px; box-sizing: border-box; outline: none; -webkit-appearance: none; }
        .history-list { max-height: 400px; overflow-y: auto; }

        /* 하단 네비게이션 */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--gray); }
        .nav-item div { font-size: 24px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }

        .page { display: none; }
        .active-page { display: block; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .buy { background: var(--up); } .sell { background: var(--down); }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary)">BlissHo Asset</h1>
            <input type="email" id="email" placeholder="이메일" style="margin-bottom:15px;">
            <input type="password" id="pw1" placeholder="비밀번호" style="margin-bottom:20px;">
            <button class="btn" onclick="handleAuth()">로그인</button>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <header style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="welcome-msg" style="font-size: 22px; font-weight: 800;">BlissHo님</span>
                    <button onclick="location.reload()" style="border:none; background:none; color:var(--gray);">로그아웃</button>
                </header>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 15px; color: var(--gray); margin-bottom: 8px;">내 총 자산 (추정)</div>
                    <div class="total-amount">₩ 124,500,000</div>
                    <div class="usd-amount">≈ $ 92,051.75</div>
                    <div class="exchange-rate">현재 환율: $1 = 1,352.5원</div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">자산 구성 비중</h3>
                    <div style="height: 280px; position: relative;">
                        <canvas id="assetChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3 style="margin-bottom:20px;">📝 매매 기록 입력</h3>
                    <select id="trade-type" style="margin-bottom:15px;"><option value="buy">매수 (BUY)</option><option value="sell">매도 (SELL)</option></select>
                    <input type="text" id="stock-name" placeholder="종목명 (예: NVDA)" style="margin-bottom:15px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom:20px;">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveData()">기록 저장 및 연동</button>
                </div>
                <div class="card">
                    <h3>📅 최근 1개월 기록</h3>
                    <div id="trade-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="display: flex; justify-content: space-between; text-align: center;">
                    <div><div style="font-size:13px; color:var(--gray);">투자 원금</div><div id="total-inv" style="font-size:18px; font-weight:bold;">₩ 0</div></div>
                    <div><div style="font-size:13px; color:var(--gray);">수익금</div><div id="total-profit" style="font-size:18px; font-weight:bold; color:var(--up);">+₩ 0</div></div>
                    <div><div style="font-size:13px; color:var(--gray);">수익률</div><div id="total-rate" style="font-size:18px; font-weight:bold; color:var(--up);">0.0%</div></div>
                </div>
                <div class="card">
                    <h3>📈 종목별 수익 상세</h3>
                    <div id="stock-detail-list"></div>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="alert('준비 중입니다')"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg",
            authDomain: "assetmanager-66aec.firebaseapp.com",
            projectId: "assetmanager-66aec",
            storageBucket: "assetmanager-66aec.firebasestorage.app",
            messagingSenderId: "928785817084",
            appId: "1:928785817084:web:2b75ce39d745bdc3202679"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let myChart = null;

        function formatNumber(el) {
            let val = el.value.replace(/[^0-9]/g, "");
            if(val) el.value = Number(val).toLocaleString();
        }

        async function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            
            if(pageId === 'home') setTimeout(initChart, 100);
            if(pageId === 'log') loadTradeHistory();
            if(pageId === 'profit') loadProfitDetails();
        }

        async function saveData() {
            const user = auth.currentUser;
            const type = document.getElementById('trade-type').value;
            const name = document.getElementById('stock-name').value;
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));

            if(!name || !qty || !price) return alert("데이터를 입력하세요.");

            await db.collection("trades").add({
                uid: user.uid, type: type, stockName: name, quantity: qty, price: price, date: new Date()
            });
            alert("저장되었습니다!");
            loadTradeHistory(); // 하단 리스트 실시간 연동
            document.getElementById('stock-name').value = "";
            document.getElementById('stock-qty').value = "";
            document.getElementById('stock-price').value = "";
        }

        async function loadTradeHistory() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc").limit(20).get();
            let html = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                html += `<div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #eee;">
                    <div><span class="badge ${d.type}">${d.type.toUpperCase()}</span> <b>${d.stockName}</b><br><small>${d.date.toDate().toLocaleDateString()}</small></div>
                    <div style="text-align:right;">₩${(d.quantity * d.price).toLocaleString()}<br><small>${d.quantity}주</small></div>
                </div>`;
            });
            document.getElementById('trade-history-list').innerHTML = html || "내역이 없습니다.";
        }

        async function loadProfitDetails() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).get();
            let stocks = {};
            let totalInv = 0;

            snapshot.forEach(doc => {
                const d = doc.data();
                if(!stocks[d.stockName]) stocks[d.stockName] = { totalCost: 0, totalQty: 0 };
                const amt = d.quantity * d.price;
                if(d.type === 'buy') { stocks[d.stockName].totalCost += amt; stocks[d.stockName].totalQty += d.quantity; totalInv += amt; }
                else { stocks[d.stockName].totalCost -= amt; stocks[d.stockName].totalQty -= d.quantity; totalInv -= amt; }
            });

            document.getElementById('total-inv').innerText = `₩ ${totalInv.toLocaleString()}`;
            // 수익금/수익률 계산 (현재가는 API 연동 전까지 +7% 가상데이터 적용)
            const mockProfit = totalInv * 0.07;
            document.getElementById('total-profit').innerText = `+₩ ${Math.floor(mockProfit).toLocaleString()}`;
            document.getElementById('total-rate').innerText = `7.0%`;

            let html = "";
            for(let name in stocks) {
                const s = stocks[name];
                if(s.totalQty <= 0) continue;
                html += `<div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #eee;">
                    <div><b>${name}</b><br><small>보유: ${s.totalQty}주</small></div>
                    <div style="text-align:right;">원금: ₩${s.totalCost.toLocaleString()}<br><span style="color:var(--up); font-size:12px;">수익: +7.2%</span></div>
                </div>`;
            }
            document.getElementById('stock-detail-list').innerHTML = html || "보유 종목이 없습니다.";
        }

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['미국주식', '한국주식', '달러현금', '원화현금'],
                    datasets: [{ data: [65, 20, 10, 5], backgroundColor: ['#1877f2', '#8bc34a', '#4da1ff', '#cddc39'] }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${c.raw}%` } } }
                }
            });
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('pw1').value;
            try {
                const res = await auth.signInWithEmailAndPassword(email, pw);
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('main-section').style.display = 'block';
                setTimeout(initChart, 200);
            } catch(e) { alert("로그인 실패"); }
        }
    </script>
</body>
</html>
