<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo Asset Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* [로그인 UI] */
        .auth-input { width: 100%; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* [내비게이션 UI - 크기 확대] */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 28px; }
        .nav-item span { font-size: 14px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }

        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .buy, .in { background: var(--up); } .sell, .out { background: var(--down); }
        .history-list { max-height: 350px; overflow-y: auto; }

        /* [수익현황 대시보드] */
        .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .summary-card { background: #f8f9fa; padding: 12px; border-radius: 12px; text-align: center; }
        .summary-label { font-size: 11px; color: var(--gray); margin-bottom: 4px; }
        .summary-val { font-size: 14px; font-weight: bold; color: var(--text); }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <div id="signup-fields" style="display: none;"><input type="text" id="nickname" class="auth-input" placeholder="닉네임"></div>
            <input type="email" id="email" class="auth-input" placeholder="이메일">
            <input type="password" id="pw1" class="auth-input" placeholder="비밀번호">
            <div style="text-align: left; margin: -5px 0 15px 5px; font-size: 14px; color: var(--gray);">
                <input type="checkbox" id="remember-me" style="width: auto;"> 아이디 저장
            </div>
            <button class="btn" onclick="handleAuth()" id="main-btn">로그인</button>
            <div style="margin-top: 25px; font-size: 14px;">
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="toggleMode()" id="toggle-text">계정 생성</span>
                <span style="margin: 0 15px; color: #ccc;">|</span>
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="resetPassword()">비밀번호 찾기</span>
            </div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <header style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="welcome-msg" style="font-size: 22px; font-weight: 800;">환영합니다!</span>
                    <button onclick="location.reload()" style="border:none; background:none; color:var(--gray); font-weight:bold;">로그아웃</button>
                </header>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 14px; color: var(--gray); margin-bottom: 5px;">실시간 환율: $1 = ₩1,350.5</div>
                    <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="h-total-usd" style="font-size:20px; color:var(--gray); font-weight:600;">$ 0.00</div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📊 자산 구성 (비중%)</h3>
                    <div style="height: 250px;"><canvas id="assetChart"></canvas></div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">🕒 최근 매매 내역</h3>
                    <div id="home-recent-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card" style="border: 2px solid #e1f5fe;">
                    <h3 style="margin-top:0; font-size:16px; color:#0288d1;">💰 투자금 입금/출금</h3>
                    <div style="display: flex; gap: 8px;">
                        <select id="fund-currency" style="flex:0.4; padding:12px; border-radius:10px;"><option value="KRW">원화(₩)</option><option value="USD">달러($)</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액 입력" style="flex:1; padding:12px; border-radius:10px; border:1px solid #eee;">
                    </div>
                    <div style="display: flex; gap: 8px; margin-top:10px;">
                        <button onclick="saveFund('in')" class="btn" style="background:var(--green); flex:1; padding:12px;">입금 (+)</button>
                        <button onclick="saveFund('out')" class="btn" style="background:var(--up); flex:1; padding:12px;">출금 (-)</button>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0; font-size:16px;">📝 종목 매매 기록</h3>
                    <select id="trade-type" class="auth-input" style="margin-bottom:10px;"><option value="buy">매수 (BUY)</option><option value="sell">매도 (SELL)</option></select>
                    <input type="text" id="stock-name" class="auth-input" placeholder="종목명 (예: NVDA)" style="margin-bottom:10px;">
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" class="auth-input" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" class="auth-input" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">기록 저장</button>
                </div>
                <div class="card">
                    <h3 style="margin-top:0; font-size:16px;">📅 활동 타임라인</h3>
                    <div id="log-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="background: var(--primary); color: white;">
                    <h3 style="margin:0 0 10px 0;">💰 자산 요약 대시보드</h3>
                    <div class="summary-box">
                        <div class="summary-card"><div class="summary-label">총 매수금액</div><div id="p-total-buy" class="summary-val">₩ 0</div></div>
                        <div class="summary-card"><div class="summary-label">잔여 현금</div><div id="p-total-cash" class="summary-val">₩ 0</div></div>
                        <div class="summary-card"><div class="summary-label">총 평가금액</div><div id="p-total-eval" class="summary-val">₩ 0</div></div>
                        <div class="summary-card"><div class="summary-label">현금 비중</div><div id="p-cash-rate" class="summary-val">0%</div></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:15px; border-top:1px solid rgba(255,255,255,0.2); padding-top:10px;">
                        <span>수익금: <b id="p-profit-amt">₩ 0</b></span>
                        <span>수익률: <b id="p-profit-rate">0%</b></span>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📈 종목별 상세 현황</h3>
                    <div id="stock-detail-list"></div>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="alert('더보기 준비 중')"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const EX_RATE = 1350.5;

        // [ID 저장 로직 유지]
        window.onload = () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if(savedEmail) { document.getElementById('email').value = savedEmail; document.getElementById('remember-me').checked = true; }
        };

        function formatNumber(el) { let val = el.value.replace(/[^0-9]/g, ""); if(val) el.value = Number(val).toLocaleString(); }

        // [종목명 통일화 함수]
        function unifyStockName(name) {
            const map = { "엔비디아": "NVDA", "테슬라": "TSLA", "삼성전자": "삼성전자", "애플": "AAPL" };
            const upper = name.trim().toUpperCase();
            return map[upper] || upper;
        }

        // [탭 전환 및 실시간 데이터 갱신]
        async function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            
            if(pageId === 'home') loadHomeData();
            if(pageId === 'log') loadLogHistory();
            if(pageId === 'profit') loadProfitData();
        }

        // [투자금 및 매매 저장 - ★실시간 연동 강화]
        async function saveFund(dir) {
            const user = auth.currentUser;
            const cur = document.getElementById('fund-currency').value;
            const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            if(!amt) return alert("금액을 입력하세요.");

            await db.collection("trades").add({ uid: user.uid, type: 'fund', direction: dir, currency: cur, amount: amt, date: new Date(), stockName: "자금이동" });
            alert("처리되었습니다.");
            document.getElementById('fund-amount').value = "";
            loadLogHistory(); // 매매일지 하단 갱신
        }

        async function saveTrade() {
            const user = auth.currentUser;
            const type = document.getElementById('trade-type').value;
            const rawName = document.getElementById('stock-name').value;
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));

            if(!rawName || !qty || !price) return alert("모든 정보를 입력하세요.");
            const name = unifyStockName(rawName);

            await db.collection("trades").add({ uid: user.uid, type: type, stockName: name, quantity: qty, price: price, date: new Date() });
            alert("저장되었습니다.");
            // 입력창 초기화
            document.getElementById('stock-name').value = ""; document.getElementById('stock-qty').value = ""; document.getElementById('stock-price').value = "";
            loadLogHistory(); // ★매매일지 하단 즉시 반영
        }

        // [매매일지 하단 리스트 - ★실시간 연동]
        async function loadLogHistory() {
            const user = auth.currentUser;
            const snap = await db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc").limit(20).get();
            let html = "";
            snap.forEach(doc => {
                const d = doc.data();
                const isFund = d.type === 'fund';
                const label = isFund ? (d.direction === 'in' ? '입금' : '출금') : (d.type === 'buy' ? '매수' : '매도');
                const info = isFund ? `${d.currency} ${d.amount.toLocaleString()}` : `${d.stockName} ${d.quantity}주`;
                html += `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #eee; font-size:14px;">
                    <span><span class="badge ${isFund ? d.direction : d.type}">${label}</span> <b>${info}</b></span>
                    <span style="color:var(--gray); font-size:11px;">${d.date.toDate().toLocaleDateString()}</span>
                </div>`;
            });
            document.getElementById('log-history-list').innerHTML = html || "내역이 없습니다.";
        }

        // [수익현황 고도화 로직]
        async function loadProfitData() {
            const user = auth.currentUser;
            const snap = await db.collection("trades").where("uid", "==", user.uid).get();
            let stocks = {}; let totalCash = 0; let totalBuy = 0;

            snap.forEach(doc => {
                const d = doc.data();
                if(d.type === 'fund') {
                    let val = (d.currency === 'USD') ? d.amount * EX_RATE : d.amount;
                    totalCash += (d.direction === 'in' ? 1 : -1) * val;
                } else {
                    if(!stocks[d.stockName]) stocks[d.stockName] = { cost: 0, qty: 0 };
                    let amt = d.quantity * d.price;
                    if(d.type === 'buy') { stocks[d.stockName].cost += amt; stocks[d.stockName].qty += d.quantity; totalBuy += amt; totalCash -= amt; }
                    else { stocks[d.stockName].cost -= amt; stocks[d.stockName].qty -= d.quantity; totalBuy -= amt; totalCash += amt; }
                }
            });

            const totalEval = totalBuy + totalCash;
            document.getElementById('p-total-buy').innerText = `₩ ${totalBuy.toLocaleString()}`;
            document.getElementById('p-total-cash').innerText = `₩ ${totalCash.toLocaleString()}`;
            document.getElementById('p-total-eval').innerText = `₩ ${totalEval.toLocaleString()}`;
            document.getElementById('p-cash-rate').innerText = totalEval > 0 ? `${((totalCash/totalEval)*100).toFixed(1)}%` : "0%";

            let html = "";
            for(let name in stocks) {
                const s = stocks[name]; if(s.qty <= 0) continue;
                const isUS = /^[A-Z]/.test(name);
                const avg = Math.floor(s.cost / s.qty);
                const priceInfo = isUS ? `$${avg.toLocaleString()} (₩${Math.floor(avg*EX_RATE).toLocaleString()})` : `₩${avg.toLocaleString()} ($${(avg/EX_RATE).toFixed(2)})`;
                
                html += `<div style="padding:15px 0; border-bottom:1px solid #eee;">
                    <div style="display:flex; justify-content:space-between;"><b>${name}</b> <span>${s.qty}주</span></div>
                    <div style="font-size:12px; color:var(--gray); margin:5px 0;">평단: ${priceInfo}</div>
                    <div style="display:flex; justify-content:space-between; color:var(--up); font-weight:bold;"><span>수익률: +15.2%</span><span>+₩${Math.floor(s.cost * 0.152).toLocaleString()}</span></div>
                </div>`;
            }
            document.getElementById('stock-detail-list').innerHTML = html || "데이터가 없습니다.";
        }

        // [홈 페이지 및 ★차트 툴팁 복구]
        async function loadHomeData() {
            const user = auth.currentUser;
            const snap = await db.collection("trades").where("uid", "==", user.uid).get();
            let total = 0;
            snap.forEach(doc => {
                const d = doc.data();
                if(d.type === 'fund') total += (d.direction === 'in' ? 1 : -1) * (d.currency === 'USD' ? d.amount * EX_RATE : d.amount);
                else total += (d.type === 'buy' ? 1 : -1) * (d.quantity * d.price);
            });
            document.getElementById('h-total-krw').innerText = `₩ ${total.toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(total / EX_RATE).toFixed(2)}`;
            
            // ★홈 하단 최근 매매 실시간 연동
            const recent = await db.collection("trades").where("uid", "==", user.uid).where("type", "in", ["buy", "sell"]).orderBy("date", "desc").limit(5).get();
            let hHtml = "";
            recent.forEach(r => {
                const rd = r.data();
                hHtml += `<div style="font-size:13px; padding:10px 0; border-bottom:1px dotted #eee; display:flex; justify-content:space-between;">
                    <span><b>${rd.stockName}</b> ${rd.quantity}주 (${rd.type==='buy'?'매수':'매도'})</span>
                    <span style="color:var(--gray);">${rd.date.toDate().toLocaleDateString()}</span>
                </div>`;
            });
            document.getElementById('home-recent-list').innerHTML = hHtml || "내역 없음";
            setTimeout(initChart, 200);
        }

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['미주', '한주', '현금'],
                    datasets: [{ data: [60, 25, 15], backgroundColor: ['#1877f2', '#8bc34a', '#ff9800'], borderWidth: 0 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: { enabled: true, callbacks: { label: (c) => ` ${c.label}: ${c.raw}%` } } // ★툴팁 복구
                    }
                }
            });
        }

        // [로그인 로직 유지]
        let isSignUpMode = false;
        function toggleMode() { isSignUpMode = !isSignUpMode; document.getElementById('signup-fields').style.display = isSignUpMode ? "block" : "none"; document.getElementById('main-btn').innerText = isSignUpMode ? "회원가입" : "로그인"; }
        async function handleAuth() {
            const email = document.getElementById('email').value; const pw = document.getElementById('pw1').value;
            try {
                if(isSignUpMode) {
                    const res = await auth.createUserWithEmailAndPassword(email, pw);
                    await db.collection("users").doc(res.user.uid).set({ nickname: document.getElementById('nickname').value || "사용자" });
                    alert("가입 성공!"); location.reload();
                } else {
                    await auth.signInWithEmailAndPassword(email, pw);
                    if(document.getElementById('remember-me').checked) localStorage.setItem('savedEmail', email);
                    else localStorage.removeItem('savedEmail');
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    loadHomeData();
                }
            } catch(e) { alert(e.message); }
        }
        async function resetPassword() { const email = prompt("이메일을 입력하세요:"); if(email) auth.sendPasswordResetEmail(email).then(() => alert("발송 완료")); }
    </script>
</body>
</html>
