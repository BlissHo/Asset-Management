<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 Pro v1.0.2</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { flex: 1; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 26px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .buy, .in { background: var(--up); } .sell, .out { background: var(--down); }
        .history-list { max-height: 350px; overflow-y: auto; }
        .profit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .profit-table th { text-align: left; color: var(--gray); padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .profit-table td { padding: 12px 0; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <div id="signup-fields" style="display: none;"><input type="text" id="nickname" class="input-group" placeholder="닉네임"></div>
            <input type="email" id="email" class="input-group" placeholder="이메일">
            <input type="password" id="pw1" class="input-group" placeholder="비밀번호">
            <div style="text-align: left; margin: -5px 0 15px 5px; font-size: 14px; color: var(--gray);">
                <input type="checkbox" id="remember-me"> <label for="remember-me">아이디 저장</label>
            </div>
            <button class="btn" onclick="handleAuth()" id="main-btn">로그인</button>
            <div style="margin-top: 25px; font-size: 14px;">
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="toggleMode()" id="toggle-text">계정 생성</span>
                <span style="margin: 0 15px; color: #ccc;">|</span>
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="resetPassword()">비밀번호 찾기</span>
            </div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <div class="card" style="text-align: center;">
                    <div style="font-size: 15px; color: var(--gray); margin-bottom: 8px;">내 총 자산 평가액</div>
                    <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="h-total-usd" style="font-size:20px; color:var(--gray); margin: 8px 0 12px 0; font-weight:600;">$ 0.00</div>
                    <div class="exchange-rate" style="font-size:14px; color:var(--up); background:#fce8e6; padding:8px 15px; border-radius:50px; display:inline-block; font-weight:bold;">환율: $1 = 1,350.5원</div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📊 자산 구성 비중</h3>
                    <div style="height: 250px;"><canvas id="assetChart"></canvas></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3>💰 입출금</h3>
                    <div class="input-row">
                        <select id="fund-currency" style="flex:0.4;"><option value="KRW">원화(₩)</option><option value="USD">달러($)</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액">
                    </div>
                    <div class="input-row">
                        <button onclick="saveFund('in')" class="btn" style="background:var(--green); flex:1;">입금 (+)</button>
                        <button onclick="saveFund('out')" class="btn" style="background:var(--up); flex:1;">출금 (-)</button>
                    </div>
                </div>
                <div class="card">
                    <h3>📝 매수/매도</h3>
                    <select id="trade-type" class="input-group"><option value="buy">매수 (BUY)</option><option value="sell">매도 (SELL)</option></select>
                    <input type="text" id="stock-name" class="input-group" placeholder="종목명 (예: TSLA)">
                    <div class="input-row">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">저장하기</button>
                </div>
                <div class="card">
                    <h3>📅 활동 내역</h3>
                    <div id="log-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="background: var(--primary); color: white; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center;">
                    <div style="grid-column: span 2; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; margin-bottom: 10px;">
                        <div style="font-size: 12px; opacity: 0.8;">총 평가금액</div>
                        <div id="p-total-eval" style="font-size: 24px; font-weight: bold;">₩ 0</div>
                    </div>
                    <div><small>매수 금액</small><div id="p-total-buy" style="font-weight:bold;">₩ 0</div></div>
                    <div><small>잔여 현금</small><div id="p-total-cash" style="font-weight:bold;">₩ 0</div></div>
                    <div style="grid-column: span 2; padding-top: 10px;"><span id="p-cash-rate" style="background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 20px;">현금 비중: 0%</span></div>
                </div>
                <div class="card">
                    <table class="profit-table">
                        <thead><tr><th>종목/수량</th><th>평단</th><th style="text-align:right;">평가액</th></tr></thead>
                        <tbody id="stock-profit-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-more" class="page">
                <div class="card">
                    <h3>⚙️ 설정 및 관리</h3>
                    <button class="btn" style="background: var(--up); margin-bottom: 15px;" onclick="clearAllData()">데이터 전체 초기화</button>
                    <button class="btn" style="background: var(--gray);" onclick="location.reload()">로그아웃</button>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const EX_RATE = 1350.5;

        // [핵심: 실시간 데이터 구독]
        function subscribeData() {
            const user = auth.currentUser;
            if(!user) return;
            db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc")
              .onSnapshot(snapshot => {
                  let trades = [];
                  snapshot.forEach(doc => trades.push({id: doc.id, ...doc.data()}));
                  updateAllPages(trades);
              });
        }

        function updateAllPages(trades) {
            let cash = 0; let stockValue = 0; let totalBuy = 0;
            let stocks = {}; let logHtml = "";

            trades.forEach(t => {
                const isFund = t.type === 'fund';
                const amt = isFund ? (t.currency === 'USD' ? t.amount * EX_RATE : t.amount) : (t.quantity * t.price);
                
                if(isFund) {
                    cash += (t.direction === 'in' ? 1 : -1) * amt;
                } else {
                    const name = t.stockName;
                    if(!stocks[name]) stocks[name] = { qty: 0, cost: 0 };
                    if(t.type === 'buy') {
                        stocks[name].qty += t.quantity; stocks[name].cost += amt;
                        totalBuy += amt; cash -= amt;
                    } else {
                        stocks[name].qty -= t.quantity; stocks[name].cost -= (stocks[name].cost/stocks[name].qty) * t.quantity;
                        cash += amt;
                    }
                }
                // 매매일지 리스트 구축
                logHtml += `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0f0f0;">
                    <div><span class="badge ${t.type==='buy'||t.direction==='in'?'in':'out'}">${isFund?(t.direction==='in'?'입금':'출금'):(t.type==='buy'?'매수':'매도')}</span> <b>${isFund?t.currency+' '+t.amount.toLocaleString():t.stockName+' '+t.quantity+'주'}</b></div>
                    <div style="font-size:12px; color:var(--gray);">${t.date.toDate().toLocaleDateString()}</div>
                </div>`;
            });

            // 계산 결과 반영
            const totalEval = cash + totalBuy; // 현재가 연동 전까지는 매수금액을 가치로 산정
            document.getElementById('h-total-krw').innerText = `₩ ${totalEval.toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(totalEval / EX_RATE).toFixed(2)}`;
            document.getElementById('p-total-eval').innerText = `₩ ${totalEval.toLocaleString()}`;
            document.getElementById('p-total-buy').innerText = `₩ ${totalBuy.toLocaleString()}`;
            document.getElementById('p-total-cash').innerText = `₩ ${cash.toLocaleString()}`;
            document.getElementById('p-cash-rate').innerText = `현금 비중: ${totalEval > 0 ? ((cash/totalEval)*100).toFixed(1) : 0}%`;
            document.getElementById('log-history-list').innerHTML = logHtml || "내역 없음";

            // 수익현황 테이블 갱신
            let stockHtml = "";
            for(let name in stocks) {
                if(stocks[name].qty <= 0) continue;
                const avg = Math.floor(stocks[name].cost / stocks[name].qty);
                stockHtml += `<tr><td><b>${name}</b><br>${stocks[name].qty}주</td><td>₩${avg.toLocaleString()}</td><td style="text-align:right;">₩${stocks[name].cost.toLocaleString()}</td></tr>`;
            }
            document.getElementById('stock-profit-table-body').innerHTML = stockHtml || "<tr><td colspan='3'>보유 종목 없음</td></tr>";

            updateChart(totalBuy, cash);
        }

        function updateChart(stock, cash) {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['주식', '현금'], datasets: [{ data: [stock, cash], backgroundColor: ['#1877f2', '#00a400'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        async function saveFund(dir) {
            const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            if(!amt) return;
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: 'fund', direction: dir, currency: document.getElementById('fund-currency').value, amount: amt, date: new Date() });
            document.getElementById('fund-amount').value = "";
        }

        async function saveTrade() {
            const name = document.getElementById('stock-name').value.trim().toUpperCase();
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
            if(!name || !qty || !price) return;
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, stockName: name, quantity: qty, price: price, date: new Date() });
            document.getElementById('stock-name').value = ""; document.getElementById('stock-qty').value = ""; document.getElementById('stock-price').value = "";
        }

        async function clearAllData() {
            if(!confirm("모든 데이터를 삭제하시겠습니까?")) return;
            const snap = await db.collection("trades").where("uid", "==", auth.currentUser.uid).get();
            const batch = db.batch();
            snap.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert("초기화되었습니다.");
        }

        function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        function formatNumber(el) { let val = el.value.replace(/[^0-9]/g, ""); if(val) el.value = Number(val).toLocaleString(); }

        let isSignUpMode = false;
        function toggleMode() { isSignUpMode = !isSignUpMode; document.getElementById('signup-fields').style.display = isSignUpMode ? "block" : "none"; }
        async function handleAuth() {
            const email = document.getElementById('email').value; const pw = document.getElementById('pw1').value;
            try {
                if(isSignUpMode) { await auth.createUserWithEmailAndPassword(email, pw); location.reload(); }
                else {
                    await auth.signInWithEmailAndPassword(email, pw);
                    if(document.getElementById('remember-me').checked) localStorage.setItem('savedEmail', email);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    subscribeData();
                }
            } catch(e) { alert(e.message); }
        }

        window.onload = () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if(savedEmail) { document.getElementById('email').value = savedEmail; document.getElementById('remember-me').checked = true; }
        };
    </script>
</body>
</html>
