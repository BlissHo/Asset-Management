<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 v1.0.13</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; --yellow: #f1c40f; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { flex: 1; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 26px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .in { background: var(--green); } .out { background: var(--up); }
        .profit-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .profit-table th { text-align: left; color: var(--gray); padding-bottom: 10px; border-bottom: 1px solid #eee; font-size: 11px; }
        .profit-table td { padding: 12px 0; border-bottom: 1px solid #f9f9f9; vertical-align: middle; }
        .val-up { color: var(--up); font-weight: bold; }
        .val-down { color: var(--down); font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-section" style="display: none;">
        <div class="container">
            <div id="page-profit" class="page">
                <div class="card" style="background: var(--primary); color: white; text-align: center;">
                    <small style="opacity:0.8;">총 평가금액</small>
                    <div id="p-total-eval" style="font-size: 26px; font-weight: bold;">₩ 0</div>
                    <div id="p-total-eval-usd" style="font-size: 14px; opacity:0.9;">$ 0.00</div>
                </div>
                <div class="card">
                    <table class="profit-table">
                        <thead>
                            <tr>
                                <th>종목/수량</th>
                                <th>평단/종가</th>
                                <th style="text-align:right;">평가액/수익률</th>
                            </tr>
                        </thead>
                        <tbody id="stock-profit-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        </div>

    <script>
        // (Firebase 초기화 및 기본 변수 v1.0.12와 동일)
        
        function updateUI(trades) {
            // ... (기존 자산 계산 로직 수행 후) ...
            
            let stockHtml = "";
            for(let n in stocks) { 
                if(stocks[n].qty > 0) { 
                    const s = stocks[n];
                    const isUSD = s.cur === 'USD';
                    const curSym = isUSD ? '$' : '₩';
                    
                    // 평단가 계산
                    const avgPrice = (s.costKRW + s.costUSD) / s.qty;
                    // 종가 (v1.0.13에서는 마지막 입력가를 종가로 활용)
                    const lastPrice = s.lastPrice; 
                    // 수익률 계산: (현재가 - 평단가) / 평단가 * 100
                    const profitRate = ((lastPrice - avgPrice) / avgPrice) * 100;
                    // 평가액
                    const evalAmt = s.qty * lastPrice;
                    
                    const rateClass = profitRate >= 0 ? "val-up" : "val-down";
                    const rateSign = profitRate >= 0 ? "▲" : "▼";

                    stockHtml += `<tr>
                        <td><b>${n}</b><br><small style="color:var(--gray);">${s.qty}주</small></td>
                        <td>
                            <div style="font-size:11px; color:var(--gray);">평단:${curSym}${avgPrice.toLocaleString(undefined,{maximumFractionDigits:isUSD?2:0})}</div>
                            <div style="font-weight:bold;">종가:${curSym}${lastPrice.toLocaleString()}</div>
                        </td>
                        <td style="text-align:right;">
                            <div style="font-weight:bold; color:var(--primary);">${curSym}${evalAmt.toLocaleString()}</div>
                            <div class="${rateClass}" style="font-size:11px;">${rateSign}${Math.abs(profitRate).toFixed(2)}%</div>
                        </td>
                    </tr>`; 
                } 
            }
            document.getElementById('stock-profit-table-body').innerHTML = stockHtml || "<tr><td colspan='3' style='text-align:center;'>내역 없음</td></tr>";
            // ... (나머지 UI 업데이트) ...
        }
    </script>
</body>
</html>
