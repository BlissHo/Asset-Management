<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 자산 관리 서비스</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        .highlight { color: #2c3e50; font-weight: bold; font-size: 1.2em; }
        #loading { color: #e67e22; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💰 자산 관리 대시보드</h1>
        <hr>
        <p>원화 자산: <span class="highlight">1,000,000원</span></p>
        <p id="exchange-rate">환율 불러오는 중... <span id="loading">(잠시만 기다려주세요)</span></p>
        <p>달러 환산: <span id="usd-result" class="highlight">-</span></p>
        <hr>
        <p style="font-size: 0.8em; color: gray;">* 1분마다 실시간 환율이 업데이트됩니다.</p>
    </div>

<script>
        async function getExchangeRate() {
            try {
                // 더 안정적인 예비 API (Fawazahmed0)
                const response = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
                const data = await response.json();
                const rate = data.usd.krw; // 이 API는 소문자로 결과를 줍니다.
                
                const krwAsset = 1000000; 
                const usdAsset = (krwAsset / rate).toFixed(2);

                document.getElementById('exchange-rate').innerHTML = `현재 환율: <b>1달러 = ${rate.toFixed(2)}원</b>`;
                document.getElementById('usd-result').innerText = `$${usdAsset}`;
                if(document.getElementById('loading')) document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error("환율 로딩 실패:", error);
                document.getElementById('exchange-rate').innerText = "환율 정보를 다시 불러오는 중입니다...";
                // 실패 시 5초 후 재시도
                setTimeout(getExchangeRate, 5000);
            }
        }

        getExchangeRate();
        setInterval(getExchangeRate, 60000);
    </script>

</body>
</html>
