<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산관리 v1.0.6</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        input, select { flex: 1; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 26px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .in { background: var(--green); } .out { background: var(--up); }
        .history-list { max-height: 350px; overflow-y: auto; }
        .profit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .profit-table th { text-align: left; color: var(--gray); padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .profit-table td { padding: 12px 0; border-bottom: 1px solid #f9f9f9; }
        .auth-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; font-size: 14px; color: var(--primary); }
        .auth-links span { cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <input type="email" id="email" class="input-group" placeholder="이메일">
            <input type="password" id="pw1" class="input-group" placeholder="비밀번호">
            <div style="text-align: left; margin-bottom: 15px;"><input type="checkbox" id="remember-me"> <label for="remember-me">아이디 저장</label></div>
            <button class="btn" onclick="handleAuth('login')">로그인</button>
            <div class="auth-links"><span onclick="handleAuth('signup')">계정 생성</span><span onclick="resetPassword()">비밀번호 찾기</span></div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            <div id="page-home" class="page active-page">
                <div class="card" style="text-align: center;">
                    <div style="font-size: 15px; color: var(--gray);">내 총 자산 평가액</div>
                    <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="h-total-usd" style="font-size:20px; color:var(--gray); margin-bottom:10px;">$ 0.00</div>
                    <div style="font-size:12px; color:var(--up);">환율: $1 = 1,350.5원</div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📊 자산 구성 비중</h3>
                    <div style="height: 250px;"><canvas id="assetChart"></canvas></div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">🕒 최근 매매 내역</h3>
                    <div id="home-recent-list"></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3>💰 입출금</h3>
                    <div class="input-row">
                        <select id="fund-currency" style="flex:0.4;"><option value="KRW">원화</option><option value="USD">달러</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액">
                    </div>
                    <div class="input-row">
                        <button onclick="saveFund('in')" class="btn" style="background:var(--green); flex:1;">입금 (+)</button>
                        <button onclick="saveFund('out')" class="btn" style="background:var(--up); flex:1;">출금 (-)</button>
                    </div>
                </div>
                <div class="card">
                    <h3>📝 매수/매도</h3>
                    <div class="input-row">
                        <select id="trade-type" style="flex:0.5;"><option value="buy">매수</option><option value="sell">매도</option></select>
                        <select id="trade-currency" style="flex:0.5;"><option value="KRW">₩ (원)</option><option value="USD">$ (달러)</option></select>
                    </div>
                    <input type="text" id="stock-name" class="input-group" placeholder="종목명">
                    <div class="input-row">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">저장하기</button>
                </div>
                <div class="card">
                    <h3>📅 활동 내역</h3>
                    <div id="log-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="background: var(--primary); color: white; text-align: center;">
                    <small>총 평가금액</small>
                    <div id="p-total-eval" style="font-size: 24px; font-weight: bold;">₩ 0</div>
                    <div style="margin-top:10px; display:flex; justify-content: space-around;">
                        <div><small>매수원금</small><div id="p-total-buy">₩ 0</div></div>
                        <div><small>잔여현금</small><div id="p-total-cash">₩ 0</div></div>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-top:0;">📈 종목별 수익 현황</h3>
                    <table class="profit-table">
                        <thead><tr><th>종목</th><th>평단(환산)</th><th style="text-align:right;">평가액</th></tr></thead>
                        <tbody id="stock-profit-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-more" class="page">
                <div class="card">
                    <h3>⚙️ 관리</h3>
                    <button class="btn" style="background:var(--up); margin-bottom:10px;" onclick="clearAllData()">전체 데이터 초기화</button>
                    <button class="btn" style="background:var(--gray);" onclick="location.reload()">로그아웃</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익</span></button>
            <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const EX_RATE = 1350.5;

        // 핵심: UI 갱신 로직 (수익현황 연동 보완)
        function updateUI(trades) {
            let cash = 0; let totalBuy = 0;
            let stocks = {}; 
            let logHtml = ""; 
            let homeRecentHtml = "";

            trades.forEach((t, idx) => {
                const isFund = t.type === 'fund';
                const tCurrency = t.currency || 'KRW';
                const basePrice = (tCurrency === 'USD') ? t.price * EX_RATE : t.price;
                const amt = isFund ? (t.currency === 'USD' ? t.amount * EX_RATE : t.amount) : (t.quantity * basePrice);
                
                if(isFund) {
                    cash += (t.direction === 'in' ? 1 : -1) * amt;
                } else {
                    const name = t.stockName;
                    if(!stocks[name]) stocks[name] = { qty: 0, cost: 0 };
                    
                    if(t.type === 'buy') {
                        stocks[name].qty += t.quantity;
                        stocks[name].cost += amt;
                        totalBuy += amt;
                        cash -= amt;
                    } else {
                        const avgCost = stocks[name].cost / stocks[name].qty;
                        stocks[name].qty -= t.quantity;
                        stocks[name].cost -= avgCost * t.quantity;
                        cash += amt;
                    }
                    
                    if(homeRecentHtml.split('</div>').length <= 5) {
                        homeRecentHtml += `<div style="padding:10px 0; border-bottom:1px solid #f0f0f0; font-size:13px;"><b>${name}</b> ${t.quantity}주 ${t.type==='buy'?'매수':'매도'} (${tCurrency})</div>`;
                    }
                }

                const label = isFund ? (t.direction==='in'?'입금':'출금') : (t.type==='buy'?'매수':'매도');
                logHtml += `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0f0f0;">
                    <div><span class="badge ${t.type==='buy'||t.direction==='in'?'in':'out'}">${label}</span> <b>${isFund?tCurrency+' '+t.amount.toLocaleString():t.stockName+' '+t.quantity+'주'}</b></div>
                    <div style="font-size:12px; color:var(--gray);">${t.date ? t.date.toDate().toLocaleDateString() : '-'}</div>
                </div>`;
            });

            // 1. 수익현황 테이블 렌더링 (이 부분이 수정되었습니다)
            let stockHtml = "";
            for(let name in stocks) {
                if(stocks[name].qty > 0) {
                    const avg = Math.floor(stocks[name].cost / stocks[name].qty);
                    stockHtml += `<tr>
                        <td><b>${name}</b><br><small>${stocks[name].qty}주</small></td>
                        <td>₩ ${avg.toLocaleString()}</td>
                        <td style="text-align:right;">₩ ${Math.floor(stocks[name].cost).toLocaleString()}</td>
                    </tr>`;
                }
            }
            document.getElementById('stock-profit-table-body').innerHTML = stockHtml || "<tr><td colspan='3' style='text-align:center; padding:20px;'>보유 종목이 없습니다.</td></tr>";

            // 2. 상단 요약 갱신
            const totalEval = cash + totalBuy;
            document.getElementById('h-total-krw').innerText = `₩ ${Math.floor(totalEval).toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(totalEval / EX_RATE).toFixed(2)}`;
            document.getElementById('p-total-eval').innerText = `₩ ${Math.floor(totalEval).toLocaleString()}`;
            document.getElementById('p-total-buy').innerText = `₩ ${Math.floor(totalBuy).toLocaleString()}`;
            document.getElementById('p-total-cash').innerText = `₩ ${Math.floor(cash).toLocaleString()}`;
            
            // 3. 리스트 및 차트
            document.getElementById('log-history-list').innerHTML = logHtml || "내역 없음";
            document.getElementById('home-recent-list').innerHTML = homeRecentHtml || "내역 없음";
            updateChart(totalBuy, cash);
        }

        // Chart 툴팁 강화
        function updateChart(stock, cash) {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            const total = stock + cash;
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['주식', '현금'], datasets: [{ data: [stock, cash], backgroundColor: ['#1877f2', '#00a400'], borderWidth: 0 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const val = context.raw;
                                    const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                                    return ` ₩ ${Math.floor(val).toLocaleString()} (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 데이터 연동 리스너
        function subscribeData() {
            if(!auth.currentUser) return;
            db.collection("trades").where("uid", "==", auth.currentUser.uid).orderBy("date", "desc").onSnapshot(snapshot => {
                let trades = [];
                snapshot.forEach(doc => trades.push({id: doc.id, ...doc.data()}));
                updateUI(trades);
            }, err => console.error("Snapshot error:", err));
        }

        // 매매 저장 (v1.0.5 유지)
        async function saveTrade() {
            const name = document.getElementById('stock-name').value.trim().toUpperCase();
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
            const currency = document.getElementById('trade-currency').value;
            if(!name || !qty || !price) return alert("입력값을 확인해주세요.");
            
            await db.collection("trades").add({ 
                uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, 
                currency: currency, stockName: name, quantity: qty, price: price, date: new Date() 
            });
            document.getElementById('stock-name').value = ""; document.getElementById('stock-qty').value = ""; document.getElementById('stock-price').value = "";
        }

        // 입출금 저장
        async function saveFund(dir) {
            const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            if(!amt) return;
            await db.collection("trades").add({ 
                uid: auth.currentUser.uid, type: 'fund', direction: dir, 
                currency: document.getElementById('fund-currency').value, amount: amt, date: new Date() 
            });
            document.getElementById('fund-amount').value = "";
        }

        // 인증 및 기타 함수
        async function handleAuth(type) {
            const email = document.getElementById('email').value; const pw = document.getElementById('pw1').value;
            if(!email || !pw) return alert("정보를 입력하세요.");
            try {
                if(type === 'login') await auth.signInWithEmailAndPassword(email, pw);
                else await auth.createUserWithEmailAndPassword(email, pw);
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('main-section').style.display = 'block';
                subscribeData();
            } catch(e) { alert(e.message); }
        }
        async function resetPassword() {
            const email = document.getElementById('email').value;
            if(!email) return alert("이메일을 입력하세요.");
            await auth.sendPasswordResetEmail(email); alert("메일이 발송되었습니다.");
        }
        async function clearAllData() {
            if(!confirm("정말 삭제하시겠습니까?")) return;
            const snap = await db.collection("trades").where("uid", "==", auth.currentUser.uid).get();
            const batch = db.batch(); snap.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
        }
        function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }
        function formatNumber(el) { let val = el.value.replace(/[^0-9]/g, ""); if(val) el.value = Number(val).toLocaleString(); }
    </script>
</body>
</html>
