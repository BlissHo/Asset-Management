// [1] 데이터 저장 기능 (매매일지)
async function saveData() {
    const user = auth.currentUser; // 현재 로그인된 사용자 확인
    if (!user) return alert("로그인이 필요합니다.");

    const name = document.getElementById('stock-name').value;
    const type = document.getElementById('trade-type').value;
    const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
    const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
    
    if(!name || !qty || !price) return alert("모든 항목을 입력해주세요!");

    try {
        // Firebase Firestore의 'trades' 컬렉션에 저장
        await db.collection("trades").add({
            uid: user.uid,
            stockName: name,
            type: type,
            quantity: qty,
            price: price,
            total: qty * price,
            date: new Date()
        });

        alert("성공적으로 기록되었습니다!");
        
        // 입력창 초기화
        document.getElementById('stock-name').value = "";
        document.getElementById('stock-qty').value = "";
        document.getElementById('stock-price').value = "";
        
        // 데이터 저장 후 수익현황 업데이트를 위해 탭 이동
        changeTab('profit', document.querySelector('.nav-item:nth-child(3)'));
        loadTradeLogs(); 
    } catch (e) {
        alert("저장 실패: " + e.message);
    }
}

// [2] 데이터 불러오기 기능 (수익현황)
async function loadTradeLogs() {
    const user = auth.currentUser;
    const logList = document.getElementById('trade-list');
    if (!user || !logList) return;

    logList.innerHTML = "데이터 불러오는 중...";

    try {
        const snapshot = await db.collection("trades")
            .where("uid", "==", user.uid)
            .orderBy("date", "desc")
            .get();

        let html = "";
        let totalProfit = 0;

        snapshot.forEach((doc) => {
            const data = doc.data();
            const color = data.type === 'buy' ? 'var(--up)' : 'var(--down)';
            const sign = data.type === 'buy' ? '매수' : '매도';
            
            html += `
                <div class="card" style="margin-bottom: 10px; padding: 15px;">
                    <div style="display: flex; justify-content: space-between;">
                        <b>${data.stockName}</b>
                        <span style="color: ${color}">${sign}</span>
                    </div>
                    <div style="font-size: 13px; color: var(--gray); margin-top: 5px;">
                        ${data.quantity.toLocaleString()}주 | ₩${data.price.toLocaleString()}
                        <div style="float: right; color: var(--text); font-weight: bold;">
                            ₩${data.total.toLocaleString()}
                        </div>
                    </div>
                </div>
            `;
        });

        logList.innerHTML = html || "기록된 매매 내역이 없습니다.";
    } catch (e) {
        console.error(e);
        logList.innerHTML = "데이터를 불러올 수 없습니다.";
    }
}

// [3] 탭 전환 시 자동 새로고침 설정
function changeTab(pageId, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    document.getElementById('page-' + pageId).classList.add('active-page');
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    if (pageId === 'profit') loadTradeLogs(); // 수익현황 탭 클릭 시 리스트 로드
}
