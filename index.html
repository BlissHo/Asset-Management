<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo Asset Manager v1.0.0</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Input & Buttons */
        input, select { width: 100%; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--up); }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 28px; }
        .nav-item span { font-size: 14px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }

        .page { display: none; } .active-page { display: block; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .in, .buy { background: var(--up); } .out, .sell { background: var(--down); }
        .history-list { max-height: 400px; overflow-y: auto; border-top: 1px solid #f0f0f0; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo v1.0.0</h1>
            <div id="signup-fields" style="display: none;"><input type="text" id="nickname" placeholder="닉네임"></div>
            <input type="email" id="email" placeholder="이메일 주소">
            <input type="password" id="pw1" placeholder="비밀번호">
            <div style="text-align: left; margin: 0 0 15px 5px; font-size: 14px;">
                <input type="checkbox" id="remember-me" style="width:auto;"> 아이디 저장
            </div>
            <button class="btn" onclick="handleAuth()" id="main-btn">로그인</button>
            <div style="margin-top: 25px; font-size: 14px;">
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="toggleMode()" id="toggle-text">계정 생성</span>
                <span style="margin: 0 15px; color: #ccc;">|</span>
                <span style="color:var(--gray); cursor:pointer; text-decoration:underline;" onclick="resetPassword()">비밀번호 찾기</span>
            </div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <header style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="welcome-msg" style="font-size: 20px; font-weight: 800;">BlissHo님</span>
                    <button onclick="location.reload()" style="border:none; background:none; color:var(--gray);">로그아웃</button>
                </header>
                <div class="card" style="text-align: center; border-bottom: 4px solid var(--primary);">
                    <div style="font-size: 14px; color: var(--gray); margin-bottom: 5px;">실시간 환율: ₩1,350.5</div>
                    <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="h-total-usd" style="font-size:20px; color:var(--gray); font-weight:600;">$ 0.00</div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📊 자산 구성 (비중%)</h3>
                    <div id="chart-container" style="height: 250px; position: relative;">
                        <canvas id="assetChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">🕒 최근 매매 내역</h3>
                    <div id="home-recent-list"></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card" style="border-left: 5px solid var(--green);">
                    <h3 style="margin:0 0 15px 0;">💰 투자금 관리</h3>
                    <div style="display: flex; gap: 8px;">
                        <select id="fund-currency" style="flex:0.4;"><option value="KRW">₩(원)</option><option value="USD">$(달러)</option></select>
                        <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액">
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="saveFund('in')" class="btn" style="background:var(--green); flex:1; padding:14px;">입금</button>
                        <button onclick="saveFund('out')" class="btn" style="background:var(--up); flex:1; padding:14px;">출금</button>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📝 종목 매매</h3>
                    <select id="trade-type"><option value="buy">매수 (BUY)</option><option value="sell">매도 (SELL)</option></select>
                    <input type="text" id="stock-name" placeholder="종목명 (NVDA, 삼성전자 등)">
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveTrade()">매매 저장</button>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📅 전체 활동 내역</h3>
                    <div id="log-history-list" class="history-list"></div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="background: #1c1e21; color: white;">
                    <h3 style="margin:0 0 15px 0;">💰 자산 요약</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><small>총 매수금액</small><div id="p-total-buy" style="font-weight:bold;">₩ 0</div></div>
                        <div><small>잔여 현금</small><div id="p-total-cash" style="font-weight:bold;">₩ 0</div></div>
                        <div><small>총 평가금액</small><div id="p-total-eval" style="font-weight:bold; color:var(--primary);">₩ 0</div></div>
                        <div><small>현금 비중</small><div id="p-cash-rate" style="font-weight:bold; color:var(--green);">0%</div></div>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📈 개별 종목 상세</h3>
                    <div id="stock-detail-list"></div>
                </div>
            </div>

            <div id="page-more" class="page">
                <div class="card">
                    <h3>⚙️ 설정 및 관리</h3>
                    <p style="color:var(--gray); font-size:14px;">모든 데이터를 영구적으로 삭제합니다. 복구할 수 없습니다.</p>
                    <button class="btn btn-danger" onclick="clearAllData()">데이터 전체 초기화</button>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        // [Firebase Config]
        const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        let myChart = null; const RATE = 1350.5;

        // [ID 저장 및 초기화]
        window.onload = () => {
            const savedEmail = localStorage.getItem('savedEmail');
            if(savedEmail) { document.getElementById('email').value = savedEmail; document.getElementById('remember-me').checked = true; }
        };

        function formatNumber(el) { let val = el.value.replace(/[^0-9]/g, ""); if(val) el.value = Number(val).toLocaleString(); }

        // [탭 전환 및 데이터 연동]
        async function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            loadAllData(); // 탭 전환 시 모든 데이터 강제 갱신
        }

        // [종목명 통일화]
        function unifyName(name) {
            const upper = name.trim().toUpperCase();
            const map = { "엔비디아": "NVDA", "테슬라": "TSLA", "애플": "AAPL", "삼성": "삼성전자" };
            return map[upper] || upper;
        }

        // [데이터 로드 마스터 함수]
        async function loadAllData() {
            const user = auth.currentUser;
            if(!user) return;
            const snap = await db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc").get();
            
            let trades = [];
            snap.forEach(doc => trades.push({id: doc.id, ...doc.data()}));
            
            updateHome(trades);
            updateLog(trades);
            updateProfit(trades);
        }

        // [홈 페이지 업데이트]
        function updateHome(trades) {
            let totalKrw = 0;
            let recentHtml = "";
            trades.forEach((d, idx) => {
                let val = (d.type === 'fund') ? (d.currency === 'USD' ? d.amount * RATE : d.amount) : (d.quantity * d.price);
                totalKrw += (d.type === 'fund' ? (d.direction === 'in' ? 1 : -1) : (d.type === 'buy' ? 1 : -1)) * val;
                
                if(idx < 5 && d.type !== 'fund') {
                    recentHtml += `<div style="font-size:13px; padding:10px 0; border-bottom:1px dotted #eee; display:flex; justify-content:space-between;">
                        <span><b>${d.stockName}</b> ${d.quantity}주 (${d.type === 'buy' ? '매수' : '매도'})</span>
                        <span style="color:var(--gray);">${d.date.toDate().toLocaleDateString()}</span>
                    </div>`;
                }
            });
            document.getElementById('h-total-krw').innerText = `₩ ${totalKrw.toLocaleString()}`;
            document.getElementById('h-total-usd').innerText = `$ ${(totalKrw / RATE).toFixed(2)}`;
            document.getElementById('home-recent-list').innerHTML = recentHtml || "내역 없음";
            
            initChart(); // 차트 재생성
        }

        // [매매일지 업데이트 - 실시간]
        function updateLog(trades) {
            let html = "";
            trades.forEach(d => {
                const isFund = d.type === 'fund';
                const label = isFund ? (d.direction === 'in' ? '입금' : '출금') : (d.type === 'buy' ? '매수' : '매도');
                const info = isFund ? `${d.currency} ${d.amount.toLocaleString()}` : `${d.stockName} ${d.quantity}주`;
                html += `<div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #f9f9f9;">
                    <span><span class="badge ${isFund ? d.direction : d.type}">${label}</span> <b>${info}</b></span>
                    <span style="color:var(--gray); font-size:11px;">${d.date.toDate().toLocaleDateString()}</span>
                </div>`;
            });
            document.getElementById('log-history-list').innerHTML = html || "내역이 없습니다.";
        }

        // [수익현황 업데이트]
        function updateProfit(trades) {
            let stocks = {}; let cash = 0; let totalBuy = 0;
            trades.forEach(d => {
                if(d.type === 'fund') {
                    cash += (d.direction === 'in' ? 1 : -1) * (d.currency === 'USD' ? d.amount * RATE : d.amount);
                } else {
                    if(!stocks[d.stockName]) stocks[d.stockName] = { cost: 0, qty: 0 };
                    let amt = d.quantity * d.price;
                    if(d.type === 'buy') { stocks[d.stockName].cost += amt; stocks[d.stockName].qty += d.quantity; totalBuy += amt; cash -= amt; }
                    else { stocks[d.stockName].cost -= amt; stocks[d.stockName].qty -= d.quantity; totalBuy -= amt; cash += amt; }
                }
            });
            const eval = totalBuy + cash;
            document.getElementById('p-total-buy').innerText = `₩ ${totalBuy.toLocaleString()}`;
            document.getElementById('p-total-cash').innerText = `₩ ${cash.toLocaleString()}`;
            document.getElementById('p-total-eval').innerText = `₩ ${eval.toLocaleString()}`;
            document.getElementById('p-cash-rate').innerText = eval > 0 ? `${((cash/eval)*100).toFixed(1)}%` : "0%";

            let html = "";
            for(let name in stocks) {
                const s = stocks[name]; if(s.qty <= 0) continue;
                const isUS = /^[A-Z]/.test(name);
                const avg = Math.floor(s.cost / s.qty);
                const dispPrice = isUS ? `$${avg.toLocaleString()} (₩${Math.floor(avg*RATE).toLocaleString()})` : `₩${avg.toLocaleString()} ($${(avg/RATE).toFixed(2)})`;
                html += `<div style="padding:15px 0; border-bottom:1px solid #eee;">
                    <div style="display:flex; justify-content:space-between;"><b>${name}</b> <span>${s.qty}주</span></div>
                    <div style="font-size:12px; color:var(--gray); margin:5px 0;">평단: ${dispPrice}</div>
                </div>`;
            }
            document.getElementById('stock-detail-list').innerHTML = html || "종목 없음";
        }

        // [데이터 저장]
        async function saveFund(dir) {
            const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
            if(!amt) return alert("금액을 입력하세요.");
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: 'fund', direction: dir, currency: document.getElementById('fund-currency').value, amount: amt, date: new Date(), stockName: "현금" });
            document.getElementById('fund-amount').value = "";
            loadAllData(); // 즉시 갱신
        }

        async function saveTrade() {
            const name = unifyName(document.getElementById('stock-name').value);
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
            if(!name || !qty || !price) return alert("정보를 모두 입력하세요.");
            await db.collection("trades").add({ uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, stockName: name, quantity: qty, price: price, date: new Date() });
            document.getElementById('stock-name').value = ""; document.getElementById('stock-qty').value = ""; document.getElementById('stock-price').value = "";
            loadAllData(); // 즉시 갱신
        }

        // [차트 핵심 로직 - 증발 방지]
        function initChart() {
            const container = document.getElementById('chart-container');
            container.innerHTML = '&nbsp;'; // 캔버스 영역 비우기
            container.innerHTML = '<canvas id="assetChart"></canvas>'; // 새 캔버스 삽입
            
            const ctx = document.getElementById('assetChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['주식', '현금'], datasets: [{ data: [75, 25], backgroundColor: ['#1877f2', '#00a400'], borderWidth: 0 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { position: 'bottom' }, tooltip: { enabled: true, callbacks: { label: (c) => ` ${c.label}: ${c.raw}%` } } }
                }
            });
        }

        // [데이터 초기화]
        async function clearAllData() {
            if(!confirm("진짜 모든 데이터를 삭제하시겠습니까?")) return;
            const snap = await db.collection("trades").where("uid", "==", auth.currentUser.uid).get();
            const batch = db.batch();
            snap.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert("초기화 완료"); loadAllData();
        }

        // [인증]
        let isSignUpMode = false;
        function toggleMode() { isSignUpMode = !isSignUpMode; document.getElementById('signup-fields').style.display = isSignUpMode ? "block" : "none"; }
        async function handleAuth() {
            const email = document.getElementById('email').value; const pw = document.getElementById('pw1').value;
            try {
                if(isSignUpMode) {
                    await auth.createUserWithEmailAndPassword(email, pw);
                    alert("가입 성공!"); location.reload();
                } else {
                    await auth.signInWithEmailAndPassword(email, pw);
                    if(document.getElementById('remember-me').checked) localStorage.setItem('savedEmail', email);
                    else localStorage.removeItem('savedEmail');
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    loadAllData();
                }
            } catch(e) { alert(e.message); }
        }
        async function resetPassword() { const email = prompt("이메일을 입력하세요:"); if(email) auth.sendPasswordResetEmail(email).then(() => alert("메일 발송")); }
    </script>
</body>
</html>
