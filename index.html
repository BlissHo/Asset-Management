<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BlissHo 자산관리 v1.0.13</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; --green: #00a400; --yellow: #f1c40f; }
body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
.container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
.card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
.input-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
.input-row { display: flex; gap: 10px; margin-bottom: 12px; }
input, select { flex: 1; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; outline: none; }
.btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
.nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
.nav-item div { font-size: 26px; }
.nav-item span { font-size: 13px; font-weight: bold; }
.nav-item.active { color: var(--primary); }
.page { display: none; } .active-page { display: block; }
.badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
.in { background: var(--green); } .out { background: var(--up); }
.history-list { max-height: 350px; overflow-y: auto; }

/* 수익 테이블 고도화 스타일 */
.profit-table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
.profit-table th { text-align: center; color: var(--gray); padding-bottom: 10px; border-bottom: 1px solid #eee; font-weight: normal; }
.profit-table td { padding: 10px 2px; border-bottom: 1px solid #f9f9f9; vertical-align: middle; text-align: center; word-break: break-all; }
.txt-right { text-align: right; }
.txt-left { text-align: left; }
.txt-bold { font-weight: bold; font-size: 12px; }
.up-color { color: var(--up); }
.down-color { color: var(--down); }

.auth-links { margin-top: 20px; display: flex; justify-content: center; gap: 20px; font-size: 14px; color: var(--primary); }
.auth-links span { cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 100%; text-align: center;">
        <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
        <input type="email" id="email" class="input-group" placeholder="이메일">
        <input type="password" id="pw1" class="input-group" placeholder="비밀번호">
        <div style="text-align: left; margin-bottom: 15px;">
            <input type="checkbox" id="remember-me"> <label for="remember-me" style="font-size:14px; color:var(--gray);">로그인 정보 저장</label>
        </div>
        <button class="btn" onclick="handleAuth('login')">로그인</button>
        <div class="auth-links"><span onclick="handleAuth('signup')">계정 생성</span><span onclick="resetPassword()">비밀번호 찾기</span></div>
    </div>
</div>

<div id="main-section" style="display: none;">
    <div class="container">
        <div id="page-home" class="page active-page">
            <div class="card" style="text-align: center;">
                <div style="font-size: 15px; color: var(--gray);">내 총 자산 평가액</div>
                <div id="h-total-krw" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                <div id="h-total-usd" style="font-size:20px; color:var(--gray); margin-bottom:10px;">$ 0.00</div>
                <div style="font-size:12px; color:var(--up);">기준 환율: ₩ 1,350.5</div>
            </div>
            <div class="card">
                <h3 style="margin-top:0;">📊 자산 구성 비중</h3>
                <div style="height: 250px;"><canvas id="assetChart"></canvas></div>
            </div>
            <div class="card">
                <h3 style="margin-top:0;">🕒 최근 매매 내역</h3>
                <div id="home-recent-list"></div>
            </div>
        </div>

        <div id="page-log" class="page">
            <div class="card">
                <h3>💰 입출금</h3>
                <div class="input-row">
                    <select id="fund-currency" style="flex:0.4;"><option value="KRW">원화</option><option value="USD">달러</option></select>
                    <input type="text" id="fund-amount" oninput="formatNumber(this)" placeholder="금액">
                </div>
                <div class="input-row">
                    <button onclick="saveFund('in')" class="btn" style="background:var(--green); flex:1;">입금 (+)</button>
                    <button onclick="saveFund('out')" class="btn" style="background:var(--up); flex:1;">출금 (-)</button>
                </div>
            </div>
            <div class="card">
                <h3>📝 매수/매도</h3>
                <div class="input-row">
                    <select id="trade-type" style="flex:0.5;"><option value="buy">매수</option><option value="sell">매도</option></select>
                    <select id="trade-currency" style="flex:0.5;"><option value="KRW">₩ (KRW)</option><option value="USD">$ (USD)</option></select>
                </div>
                <input type="text" id="stock-name" class="input-group" placeholder="종목명 (예: NVDA, 삼성전자)" oninput="detectCurrency(this)">
                <div class="input-row">
                    <input type="text" id="stock-qty" oninput="formatNumber(this)" placeholder="수량">
                    <input type="text" id="stock-price" oninput="formatNumber(this)" placeholder="단가">
                </div>
                <button class="btn" onclick="saveTrade()">저장하기</button>
            </div>
            <div class="card">
                <h3>📅 활동 내역</h3>
                <div id="log-history-list" class="history-list"></div>
            </div>
        </div>

        <div id="page-profit" class="page">
            <div class="card" style="background: var(--primary); color: white; text-align: center;">
                <small style="opacity:0.8;">총 평가금액</small>
                <div id="p-total-eval" style="font-size: 26px; font-weight: bold;">₩ 0</div>
                <div id="p-total-eval-usd" style="font-size: 14px; opacity:0.9; margin-bottom:15px;">$ 0.00</div>

                <div style="display:flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.2); padding-top:15px; gap: 5px;">
                    <div style="flex:1;">
                        <small style="opacity:0.8;">투자원금</small>
                        <div id="p-detail-buy-krw" style="font-size:12px; font-weight:bold;">₩ 0</div>
                    </div>
                    <div style="width:1px; background:rgba(255,255,255,0.2);"></div>
                    <div style="flex:1;">
                        <small style="opacity:0.8;">잔여현금 (<span id="p-cash-ratio">0</span>%)</small>
                        <div id="p-detail-cash-krw" style="font-size:12px; font-weight:bold;">₩ 0</div>
                    </div>
                </div>
            </div>
            <div class="card" style="padding: 15px 10px;">
                <table class="profit-table">
                    <thead>
                        <tr>
                            <th width="22%">종목/수량</th>
                            <th width="18%">종가</th>
                            <th width="20%">평단</th>
                            <th width="25%">평가액</th>
                            <th width="15%">수익률</th>
                        </tr>
                    </thead>
                    <tbody id="stock-profit-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="page-more" class="page">
            <div class="card"><h3>⚙️ 관리</h3><button class="btn" style="background:var(--up); margin-bottom:10px;" onclick="clearAllData()">전체 데이터 초기화</button><button class="btn" style="background:var(--gray);" onclick="handleLogout()">로그아웃</button></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
        <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>일지</span></button>
        <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익</span></button>
        <button class="nav-item" onclick="changeTab('more', this)"><div>⚙️</div><span>더보기</span></button>
    </nav>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg", authDomain: "assetmanager-66aec.firebaseapp.com", projectId: "assetmanager-66aec", storageBucket: "assetmanager-66aec.firebasestorage.app", messagingSenderId: "928785817084", appId: "1:928785817084:web:2b75ce39d745bdc3202679" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.firestore();
    let myChart = null; const EX_RATE = 1350.5;

    const stockAlias = { "엔비디아": "NVDA", "로켓랩": "RKLB", "레드와이어": "RDW", "애플": "AAPL", "테슬라": "TSLA", "삼성": "삼성전자" };
    const usStockKorean = ["엔비디아", "로켓랩", "레드와이어", "테슬라", "애플", "구글", "마이크로소프트"];

    function getStandardName(name) {
        const upperName = name.trim().toUpperCase();
        return stockAlias[upperName] || upperName;
    }

    function detectCurrency(el) {
        const val = el.value.trim();
        const curSelect = document.getElementById('trade-currency');
        if(!val) return;
        const isKorean = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(val);
        const isUsException = usStockKorean.includes(val);
        curSelect.value = (isUsException || (!isKorean && /[a-zA-Z]/.test(val))) ? "USD" : "KRW";
    }

    function updateUI(trades) {
        let cashKRW = 0; let cashUSD = 0; let totalInvestKRW = 0;
        let stocks = {}; let logHtml = ""; let homeRecentHtml = "";

        // 데이터 처리 순서: 과거순으로 정렬하여 평단가 계산 (FIFO 유사 방식)
        const sortedTrades = [...trades].sort((a, b) => a.date - b.date);

        sortedTrades.forEach((t) => {
            const isFund = t.type === 'fund';
            const cur = t.currency || 'KRW';
            if(isFund) {
                if(cur === 'KRW') cashKRW += (t.direction === 'in' ? 1 : -1) * t.amount;
                else cashUSD += (t.direction === 'in' ? 1 : -1) * t.amount;
            } else {
                const name = getStandardName(t.stockName);
                if(!stocks[name]) stocks[name] = { qty: 0, totalCostKRW: 0, lastPrice: 0, cur: cur };
                const tradeAmt = t.quantity * t.price;
                const tradeAmtKRW = cur === 'KRW' ? tradeAmt : tradeAmt * EX_RATE;
                
                if(t.type === 'buy') {
                    stocks[name].qty += t.quantity;
                    stocks[name].totalCostKRW += tradeAmtKRW;
                    if(cur === 'KRW') cashKRW -= tradeAmt; else cashUSD -= tradeAmt;
                } else {
                    const avgBefore = stocks[name].totalCostKRW / stocks[name].qty;
                    stocks[name].qty -= t.quantity;
                    stocks[name].totalCostKRW -= (avgBefore * t.quantity);
                    if(cur === 'KRW') cashKRW += tradeAmt; else cashUSD += tradeAmt;
                }
                stocks[name].lastPrice = t.price; // 가장 최근 거래가를 종가 대용으로 사용
            }
        });

        // 결과 요약
        const totalStockValueKRW = Object.values(stocks).reduce((acc, s) => acc + (s.qty > 0 ? (s.lastPrice * (s.cur === 'USD' ? EX_RATE : 1) * s.qty) : 0), 0);
        const totalCashKRW = cashKRW + (cashUSD * EX_RATE);
        const totalEvalKRW = totalCashKRW + totalStockValueKRW;
        const cashRatio = totalEvalKRW > 0 ? ((totalCashKRW / totalEvalKRW) * 100).toFixed(1) : 0;

        // UI 갱신 (상단 카드)
        document.getElementById('h-total-krw').innerText = `₩ ${Math.floor(totalEvalKRW).toLocaleString()}`;
        document.getElementById('h-total-usd').innerText = `$ ${(totalEvalKRW / EX_RATE).toFixed(2)}`;
        document.getElementById('p-total-eval').innerText = `₩ ${Math.floor(totalEvalKRW).toLocaleString()}`;
        document.getElementById('p-total-eval-usd').innerText = `$ ${(totalEvalKRW / EX_RATE).toFixed(2)}`;
        document.getElementById('p-detail-cash-krw').innerText = `₩ ${Math.floor(totalCashKRW).toLocaleString()}`;
        document.getElementById('p-cash-ratio').innerText = cashRatio;

        // 수익 테이블 생성
        let stockHtml = "";
        let buySumKRW = 0;
        for(let n in stocks) {
            const s = stocks[n];
            if(s.qty > 0) {
                const isUSD = s.cur === 'USD';
                const avgPrice = s.totalCostKRW / s.qty / (isUSD ? EX_RATE : 1);
                const currentPrice = s.lastPrice; // 임시 종가
                const evalAmtKRW = s.qty * currentPrice * (isUSD ? EX_RATE : 1);
                const profitRate = ((currentPrice - avgPrice) / avgPrice * 100).toFixed(2);
                const rateClass = profitRate >= 0 ? 'up-color' : 'down-color';
                buySumKRW += s.totalCostKRW;

                stockHtml += `
                <tr>
                    <td class="txt-left"><div class="txt-bold">${n}</div><div>${s.qty.toLocaleString()}주</div></td>
                    <td><div class="txt-bold">${isUSD?'$':'₩'}${currentPrice.toLocaleString()}</div></td>
                    <td><div class="txt-bold">${isUSD?'$':'₩'}${avgPrice.toLocaleString(undefined,{maximumFractionDigits:1})}</div></td>
                    <td class="txt-right">
                        <div class="txt-bold ${rateClass}">₩${Math.floor(evalAmtKRW).toLocaleString()}</div>
                        <div style="color:var(--gray)">$${(evalAmtKRW/EX_RATE).toFixed(2)}</div>
                    </td>
                    <td class="${rateClass} txt-bold">${profitRate}%</td>
                </tr>`;
            }
        }
        document.getElementById('p-detail-buy-krw').innerText = `₩ ${Math.floor(buySumKRW).toLocaleString()}`;
        document.getElementById('stock-profit-table-body').innerHTML = stockHtml || "<tr><td colspan='5' style='padding:30px;'>보유 종목이 없습니다.</td></tr>";
        
        // 최근 매매 내역 (최신순 5개)
        const recentTrades = [...trades].slice(0, 5);
        document.getElementById('home-recent-list').innerHTML = recentTrades.map(t => {
            const label = t.type === 'fund' ? (t.direction==='in'?'입금':'출금') : (t.type==='buy'?'매수':'매도');
            return `<div style="padding:12px 0; border-bottom:1px solid #f0f0f0; font-size:13px; display:flex; justify-content:space-between;">
                <span><b>${t.stockName || t.currency}</b> ${t.quantity || ''} ${label}</span>
                <span style="color:var(--primary); font-weight:bold;">${(t.currency==='USD'?'$':'₩')}${(t.price || t.amount).toLocaleString()}</span>
            </div>`;
        }).join('') || "내역 없음";

        // 활동 내역
        document.getElementById('log-history-list').innerHTML = trades.map(t => `
            <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f0f0f0;">
                <div><span class="badge ${t.type==='buy'||t.direction==='in'?'in':'out'}">${t.type==='fund'?(t.direction==='in'?'입금':'출금'):(t.type==='buy'?'매수':'매도')}</span> <b>${t.type==='fund'?t.currency+' '+t.amount.toLocaleString():t.stockName+' '+t.quantity+'주'}</b></div>
                <div style="font-size:11px; color:var(--gray);">${t.date ? t.date.toDate().toLocaleDateString() : '-'}</div>
            </div>`).join('') || "내역 없음";

        updateChart(buySumKRW, totalCashKRW);
    }

    function updateChart(stockK, cashK) {
        const ctx = document.getElementById('assetChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['주식자산', '현금자산'],
                datasets: [{ data: [stockK, cashK], backgroundColor: ['#1877f2', '#00a400'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, cutout: '70%' }
        });
    }

    // --- 유틸리티 및 인증 기능 ---
    async function handleAuth(type) {
        const email = document.getElementById('email').value;
        const pw = document.getElementById('pw1').value;
        if(!email || !pw) return alert("이메일과 비밀번호를 입력하세요.");
        try {
            if(type === 'login') await auth.signInWithEmailAndPassword(email, pw);
            else await auth.createUserWithEmailAndPassword(email, pw);
            if(document.getElementById('remember-me').checked) localStorage.setItem('savedEmail', email);
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('main-section').style.display = 'block';
            subscribeData();
        } catch(e) { alert(e.message); }
    }

    function subscribeData() {
        db.collection("trades").where("uid", "==", auth.currentUser.uid).orderBy("date", "desc")
          .onSnapshot(snap => {
              let trades = [];
              snap.forEach(doc => trades.push({id: doc.id, ...doc.data()}));
              updateUI(trades);
          });
    }

    async function saveTrade() {
        const name = document.getElementById('stock-name').value.trim();
        const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
        const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));
        const cur = document.getElementById('trade-currency').value;
        if(!name || !qty || !price) return alert("정보를 모두 입력해주세요.");
        await db.collection("trades").add({ uid: auth.currentUser.uid, type: document.getElementById('trade-type').value, currency: cur, stockName: name, quantity: qty, price: price, date: new Date() });
        ['stock-name', 'stock-qty', 'stock-price'].forEach(id => document.getElementById(id).value = "");
    }

    async function saveFund(dir) {
        const amt = Number(document.getElementById('fund-amount').value.replace(/,/g, ""));
        const cur = document.getElementById('fund-currency').value;
        if(!amt) return;
        await db.collection("trades").add({ uid: auth.currentUser.uid, type: 'fund', direction: dir, currency: cur, amount: amt, date: new Date() });
        document.getElementById('fund-amount').value = "";
    }

    function changeTab(pageId, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById('page-' + pageId).classList.add('active-page');
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }

    function formatNumber(el) {
        let val = el.value.replace(/[^0-9.]/g, "");
        if(val) el.value = Number(val).toLocaleString();
    }

    async function clearAllData() {
        if(!confirm("정말로 모든 데이터를 삭제하시겠습니까?")) return;
        const snap = await db.collection("trades").where("uid", "==", auth.currentUser.uid).get();
        const batch = db.batch();
        snap.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        alert("초기화되었습니다.");
    }

    function handleLogout() { auth.signOut(); location.reload(); }

    window.onload = () => {
        const savedEmail = localStorage.getItem('savedEmail');
        if(savedEmail) document.getElementById('email').value = savedEmail;
    };
</script>

</body>
</html>
