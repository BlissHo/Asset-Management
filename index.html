<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlissHo 자산 Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #1877f2; --bg: #f0f2f5; --text: #1c1e21; --gray: #65676b; --up: #d93025; --down: #1266df; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; -webkit-font-smoothing: antialiased; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box; padding-bottom: 120px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* 로그인 UI 개선 */
        .auth-input { width: 100%; padding: 16px; border: 1.5px solid #eee; border-radius: 12px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; }
        .auth-link { font-size: 14px; color: var(--gray); text-decoration: underline; cursor: pointer; margin: 0 10px; }

        /* 하단 네비게이션 크기 확대 */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: white; display: flex; border-top: 1px solid #eee; z-index: 1000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { flex: 1; text-align: center; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--gray); cursor: pointer; }
        .nav-item div { font-size: 26px; }
        .nav-item span { font-size: 13px; font-weight: bold; }
        .nav-item.active { color: var(--primary); }

        .page { display: none; }
        .active-page { display: block; }
        .btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
        .buy { background: var(--up); } .sell { background: var(--down); }
        .history-list { max-height: 400px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>

    <div id="auth-section" class="container" style="display: flex; align-items: center; min-height: 100vh;">
        <div class="card" style="width: 100%; text-align: center;">
            <h1 style="color: var(--primary); margin-bottom: 30px;">BlissHo Asset</h1>
            <div id="signup-fields" style="display: none;">
                <input type="text" id="nickname" class="auth-input" placeholder="사용할 닉네임">
            </div>
            <input type="email" id="email" class="auth-input" placeholder="이메일 주소">
            <input type="password" id="pw1" class="auth-input" placeholder="비밀번호">
            <button class="btn" onclick="handleAuth()" id="main-btn" style="margin-top:10px;">로그인</button>
            <div style="margin-top: 25px;">
                <span class="auth-link" onclick="toggleMode()" id="toggle-text">계정 생성</span>
                <span class="auth-link" onclick="resetPassword()">비밀번호 찾기</span>
            </div>
        </div>
    </div>

    <div id="main-section" style="display: none;">
        <div class="container">
            
            <div id="page-home" class="page active-page">
                <header style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
                    <span id="welcome-msg" style="font-size: 22px; font-weight: 800;">환영합니다!</span>
                    <button onclick="location.reload()" style="border:none; background:none; color:var(--gray);">로그아웃</button>
                </header>
                <div class="card" style="text-align: center;">
                    <div style="font-size: 15px; color: var(--gray); margin-bottom: 8px;">내 총 자산 (추정)</div>
                    <div id="home-total-krw" class="total-amount" style="font-size:32px; font-weight:800; color:var(--primary);">₩ 0</div>
                    <div id="home-total-usd" style="font-size:20px; color:var(--gray); margin: 8px 0 12px 0; font-weight:600;">$ 0.00</div>
                    <div class="exchange-rate" style="font-size:14px; color:var(--up); background:#fce8e6; padding:8px 15px; border-radius:50px; display:inline-block; font-weight:bold;">환율: $1 = 1,350원</div>
                </div>
                <div class="card">
                    <h3 style="margin:0 0 15px 0;">📊 자산 비중</h3>
                    <div style="height: 250px;"><canvas id="assetChart"></canvas></div>
                </div>
            </div>

            <div id="page-log" class="page">
                <div class="card">
                    <h3 style="margin-bottom:20px;">📝 매매 기록 입력</h3>
                    <select id="trade-type" class="auth-input"><option value="buy">매수 (BUY)</option><option value="sell">매도 (SELL)</option></select>
                    <input type="text" id="stock-name" class="auth-input" placeholder="종목명 (예: TSLA)">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <input type="text" id="stock-qty" class="auth-input" oninput="formatNumber(this)" placeholder="수량">
                        <input type="text" id="stock-price" class="auth-input" oninput="formatNumber(this)" placeholder="단가">
                    </div>
                    <button class="btn" onclick="saveData()">데이터 저장 및 하단 반영</button>
                </div>
                <div class="card">
                    <h3>📅 최근 1개월 매매 내역</h3>
                    <div id="trade-history-list" class="history-list">
                        <p style="text-align:center; color:var(--gray); padding:20px;">내역을 불러오는 중...</p>
                    </div>
                </div>
            </div>

            <div id="page-profit" class="page">
                <div class="card" style="display: flex; justify-content: space-between; text-align: center; background: var(--primary); color: white;">
                    <div><div style="font-size:12px; opacity:0.8;">총 투자원금</div><div id="p-total-inv" style="font-size:18px; font-weight:bold;">₩ 0</div></div>
                    <div><div style="font-size:12px; opacity:0.8;">총 수익금</div><div id="p-total-profit" style="font-size:18px; font-weight:bold;">₩ 0</div></div>
                    <div><div style="font-size:12px; opacity:0.8;">수익률</div><div id="p-total-rate" style="font-size:18px; font-weight:bold;">0.0%</div></div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:15px;">📈 종목별 수익 현황</h3>
                    <div id="stock-profit-list"></div>
                </div>
            </div>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="changeTab('home', this)"><div>🏠</div><span>홈</span></button>
            <button class="nav-item" onclick="changeTab('log', this)"><div>📊</div><span>매매일지</span></button>
            <button class="nav-item" onclick="changeTab('profit', this)"><div>💰</div><span>수익현황</span></button>
            <button class="nav-item" onclick="alert('더보기 기능 준비 중')"><div>⚙️</div><span>더보기</span></button>
        </nav>
    </div>

    <script>
        // [Firebase 초기화]
        const firebaseConfig = {
            apiKey: "AIzaSyCEPH9Y5e0VoqGl4FViWo5pVlA8UlxpzCg",
            authDomain: "assetmanager-66aec.firebaseapp.com",
            projectId: "assetmanager-66aec",
            storageBucket: "assetmanager-66aec.firebasestorage.app",
            messagingSenderId: "928785817084",
            appId: "1:928785817084:web:2b75ce39d745bdc3202679"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let myChart = null;

        // [공통 기능]
        function formatNumber(el) {
            let val = el.value.replace(/[^0-9]/g, "");
            if(val) el.value = Number(val).toLocaleString();
        }

        async function changeTab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            
            if(pageId === 'home') loadHomeData();
            if(pageId === 'log') loadTradeHistory();
            if(pageId === 'profit') loadProfitDetails();
        }

        // [인증 기능: 복구완료]
        let isSignUpMode = false;
        function toggleMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('signup-fields').style.display = isSignUpMode ? "block" : "none";
            document.getElementById('main-btn').innerText = isSignUpMode ? "회원가입 완료" : "로그인";
            document.getElementById('toggle-text').innerText = isSignUpMode ? "이미 계정이 있나요?" : "계정 생성";
        }

        async function resetPassword() {
            const email = prompt("비밀번호 재설정 메일을 보낼 이메일 주소를 입력하세요:");
            if(email) {
                try { await auth.sendPasswordResetEmail(email); alert("메일을 발송했습니다."); }
                catch(e) { alert("오류: " + e.message); }
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('pw1').value;
            try {
                if(isSignUpMode) {
                    const res = await auth.createUserWithEmailAndPassword(email, pw);
                    const nick = document.getElementById('nickname').value || "사용자";
                    await db.collection("users").doc(res.user.uid).set({ nickname: nick, createdAt: new Date() });
                    alert("가입 성공! 로그인 해주세요.");
                    location.reload();
                } else {
                    const res = await auth.signInWithEmailAndPassword(email, pw);
                    const userDoc = await db.collection("users").doc(res.user.uid).get();
                    document.getElementById('welcome-msg').innerText = `${userDoc.data()?.nickname || '회원'}님 환영합니다!`;
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('main-section').style.display = 'block';
                    loadHomeData();
                }
            } catch(e) { alert("오류: " + e.message); }
        }

        // [매매일지: 실시간 연동 복구완료]
        async function saveData() {
            const user = auth.currentUser;
            const type = document.getElementById('trade-type').value;
            const name = document.getElementById('stock-name').value;
            const qty = Number(document.getElementById('stock-qty').value.replace(/,/g, ""));
            const price = Number(document.getElementById('stock-price').value.replace(/,/g, ""));

            if(!name || !qty || !price) return alert("빈칸을 채워주세요.");

            try {
                await db.collection("trades").add({
                    uid: user.uid, type: type, stockName: name.toUpperCase(), quantity: qty, price: price, date: new Date()
                });
                alert("저장되었습니다!");
                // 즉시 하단 내역 업데이트
                loadTradeHistory();
                // 입력 필드 초기화
                document.getElementById('stock-name').value = "";
                document.getElementById('stock-qty').value = "";
                document.getElementById('stock-price').value = "";
            } catch(e) { alert(e.message); }
        }

        async function loadTradeHistory() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).orderBy("date", "desc").limit(15).get();
            let html = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #eee;">
                    <div><span class="badge ${d.type}">${d.type === 'buy' ? '매수' : '매도'}</span> <b>${d.stockName}</b><br><small>${d.date.toDate().toLocaleDateString()}</small></div>
                    <div style="text-align:right;">₩${(d.quantity * d.price).toLocaleString()}<br><small>${d.quantity}주</small></div>
                </div>`;
            });
            document.getElementById('trade-history-list').innerHTML = html || "내역이 없습니다.";
        }

        // [수익현황: 고도화 로직 복구완료]
        async function loadProfitDetails() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).get();
            let stocks = {};
            let totalInv = 0;

            snapshot.forEach(doc => {
                const d = doc.data();
                if(!stocks[d.stockName]) stocks[d.stockName] = { cost: 0, qty: 0 };
                const amt = d.quantity * d.price;
                if(d.type === 'buy') { stocks[d.stockName].cost += amt; stocks[d.stockName].qty += d.quantity; totalInv += amt; }
                else { stocks[d.stockName].cost -= amt; stocks[d.stockName].qty -= d.quantity; totalInv -= amt; }
            });

            document.getElementById('p-total-inv').innerText = `₩ ${totalInv.toLocaleString()}`;
            // 가상 수익 로직 (현재가 연동 전 8.5% 가정)
            const mockProfit = totalInv * 0.085;
            document.getElementById('p-total-profit').innerText = `₩ ${Math.floor(mockProfit).toLocaleString()}`;
            document.getElementById('p-total-rate').innerText = `8.5%`;

            let html = "";
            for(let name in stocks) {
                const s = stocks[name];
                if(s.qty <= 0) continue;
                html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #eee;">
                    <div><b>${name}</b><br><small>보유: ${s.qty}주</small></div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold;">원금: ₩${s.cost.toLocaleString()}</div>
                        <div style="color:var(--up); font-size:12px;">예상수익: +₩${Math.floor(s.cost * 0.085).toLocaleString()} (8.5%)</div>
                    </div>
                </div>`;
            }
            document.getElementById('stock-profit-list').innerHTML = html || "보유 종목이 없습니다.";
        }

        // [홈 데이터 및 차트]
        async function loadHomeData() {
            const user = auth.currentUser;
            const snapshot = await db.collection("trades").where("uid", "==", user.uid).get();
            let total = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                total += (d.type === 'buy' ? 1 : -1) * (d.quantity * d.price);
            });
            document.getElementById('home-total-krw').innerText = `₩ ${total.toLocaleString()}`;
            document.getElementById('home-total-usd').innerText = `$ ${(total / 1350).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            setTimeout(initChart, 200);
        }

        function initChart() {
            const ctx = document.getElementById('assetChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['미국주식', '한국주식', '달러', '현금'],
                    datasets: [{ data: [60, 25, 10, 5], backgroundColor: ['#1877f2', '#8bc34a', '#4da1ff', '#cddc39'], borderWidth: 0 }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: (c) => ` ${c.label}: ${c.raw}%` } } }
                }
            });
        }
    </script>
</body>
</html>
